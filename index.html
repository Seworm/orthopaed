    <script>
        // Comprehensive Question Dataset (100 in Ch53, 150 in Ch54)
        const RAW_DATA_CH53 = [
            { id: 1, text: "Which of the following is/are TRUE of fractures", options: ["A multi-fragmented fracture is one in which there are more than one fracture at different sites in the same bone.", "An oblique fracture results from compression forces acting on the cortex", "An impacted fracture is one in which the fractured ends are interlocked and is caused by a compression forces", "A greenstick fracture is one in which both cortices bend", "A stress fracture is caused by repeated applications of a load below the ultimate strength of the bone"], correct: ["B", "E"], exp: "Oblique fractures occur due to compressive or torsional loads across the bone shaft. Stress fractures result from repetitive micro-damage under loads lower than maximum mechanical breaking strength." },
            { id: 2, text: "In the healing of a fracture", options: ["Bleeding from the fracture site and soft tissues forms a haematoma and fibrin clot that is a source of haemopoietic cells which can secrete growth factors GF", "Non-steroidal anti-inflammatory drugs (NSAIDs) enhances the healing of a fracture", "The reparative response occurs between 2days and 2 weeks", "Ultrasound can decrease the time to clinical healing and radiological union", "Remodeling is completed in a year"], correct: ["A", "C", "D"], exp: "Fracture hematoma triggers early osteoinductive growth factor cascades. The primary reparative phase runs between 2 days and 2 weeks. Low-intensity pulsed ultrasound (LIPUS) accelerates union." },
            { id: 3, text: "The time taken for a fracture to unite:", options: ["In an adult upper limb is about 6 weeks", "In an adult lower limb is about 18 weeks", "In a lower limb in a child is about 12 weeks", "In an upper limb in a child is about 3 weeks", "Is shorter in a transverse fracture than in an oblique fracture"], correct: ["A", "D"], exp: "Standard fracture union rules of thumb (Perkins' rule): Upper limb in adults ~6 weeks; Children heal in half the time (Upper limb ~3 weeks). Oblique fractures unite faster than transverse ones due to larger surface area contact." },
            { id: 4, text: "In the healing of a fracture", options: ["Callus becomes radiologically visible after 3 weeks", "External bridging callus ossifies by endochondral ossification to form woven bone", "Infection of the fracture site leads to low oxygen tension which will cause excessive formation of cartilage and fibrous tissue", "Callus formed will remain a permanent part of the bone", "Cancellous bone heals poorly compared to dense cortical bone"], correct: ["A", "B", "C"], exp: "Radiological soft-to-hard callus visualization begins around 3 weeks. Periosteal soft callus transforms via endochondral ossification into woven bone. Hypoxia from infection impairs direct osteogenesis, inducing fibrous tissue." },
            { id: 5, text: "Open reduction and internal fixation of a fracture:", options: ["Should be done ideally 4-7 days after injury", "Allows early mobilization of muscles and joints thereby preventing wasting of muscles and stiffness of joints", "Reduces the incidence of deep venous thrombosis", "Promotes early healing of the fracture", "Should be delayed until other life threatening injuries have been treated"], correct: ["A", "B", "C", "E"], exp: "ORIF facilitates immediate rigid stabilization and early limb joint mobilization, preventing stiffness, atrophy, and reducing DVT risk. In polytrauma, life-threatening instability takes precedence (Damage Control Orthopaedics)." },
            { id: 6, text: "The following are causes of delayed union of a fracture:", options: ["Poor blood supply to the fracture as a result of excessive soft tissue stripping", "Excessive mobility at the fracture site", "Early mobilization of joints and muscle at the fracture site", "Distraction of the fracture ends by excessive traction", "Large doses of Vit. A"], correct: ["A", "B", "D"], exp: "Preservation of periosteal blood supply, strain control, and bone end contact are essential for timely union. Distraction and mechanical instability delay callus bridge formation." },
            { id: 7, text: "In non-union of a fracture:", options: ["Clinically presents as painful movement at the fracture site", "There is a gap between the fracture fragments, which may be considerable and is pathologically filled with cartilage.", "Bone growth may be stimulated with autogenous bone graft at the fracture site.", "The cause maybe inadequate blood supply to the fracture.", "A spiral fracture has a higher risk of non-union than a transverse fracture"], correct: ["B", "C", "D"], exp: "Non-union pathologically features fibrous or cartilaginous pseudarthrosis. Autologous cancellous bone grafting provides osteogenesis, osteoinduction, and osteoconduction." },
            { id: 8, text: "The most serious complication of an open fracture is:", options: ["Haemorrhage", "Infection", "Delayed union", "Non-union", "Ischaemic contracture of muscles"], correct: ["B"], exp: "Infection (osteomyelitis) is the hallmark severe complication of open fractures due to direct bacterial inoculation and devitalized tissue." },
            { id: 9, text: "The following are indications for open reduction and internal fixation of fractures", options: ["Pathological fractures", "Multiple fractures", "Open fractures with severe contamination", "Fractures of the patella", "Fractures complicated by compartment syndrome"], correct: ["A", "B", "D"], exp: "Indications for ORIF include displaced intra-articular fractures (patella), pathological fractures needing rigid stabilization, and polytrauma/multiple fractures." },
            { id: 10, text: "Three days after sustaining a fracture of the shaft of the femur, a 50-year old man becomes confused, dyspnoeic and has a low-grade fever. Some petechial rashes are observed. You will suspect most strongly:", options: ["Lobar pneumonia", "Septicaemia", "Pulmonary embolism", "Fat embolism", "Cerebrovascular accident"], correct: ["D"], exp: "The classic triad of Fat Embolism Syndrome (FES) following long bone fractures consists of hypoxemia/dyspnea, neurological changes (confusion), and petechial rash." },
            { id: 11, text: "What the patient needs most is:", options: ["Antibiotics", "Oxygen", "Heparin", "Sedation", "To be left alone"], correct: ["B"], exp: "Supportive care with high-flow oxygen therapy to correct hypoxemia is the primary cornerstone of managing Fat Embolism Syndrome." },
            { id: 12, text: "X-ray appearance of a sclerotic, smooth and well-defined fracture margins is evidence of:", options: ["Callus", "Delayed union", "Union", "Non-union", "Avascular necrosis"], correct: ["D"], exp: "Sclerotic, rounded, smooth margins with closure of the medullary canal are definitive radiological signatures of established non-union." },
            { id: 13, text: "Fracture of the clavicle:", options: ["Occurs most commonly in the middle third and usually as a result of direct violence", "If in the middle third, the medial fragment is pulled upward and backward and the lateral fragment downward and forward", "Causes the patient to tilt his head to the contralateral side", "Is best treated with a 'figure-of-eight' bandage which is re-applied every other day and retained for six weeks", "Is commonly complicated by non-unions and mal-unions."], correct: ["B"], exp: "In midshaft clavicle fractures, sternocleidomastoid elevates the proximal fragment, while gravity and pectoralis major pull the distal fragment down and medially." },
            { id: 14, text: "Fractures of the scapula:", options: ["Are caused by direct violence", "Are usually associated with fractures of the underlying ribs", "Seldom cause severe displacement of the fragments", "Are best treated by the use of a sling for 3 weeks followed by active mobilization exercises.", "The best treatment is open reduction and internal fixation with plates and screws"], correct: ["A", "B", "C", "D"], exp: "Scapular fractures require high-energy direct trauma, frequently coinciding with rib fractures. Due to thick surrounding muscle envelopes, non-operative treatment with a sling yields good function." },
            { id: 15, text: "Acromio-clavicular joint dislocations:", options: ["Is commonly caused by a fall or blow on the tip of the shoulder", "Is common among horse riders and car drivers", "Causes downward displacement of the clavicle and upward displacement of the acromion", "X-rays should be taken with the patient standing", "Is best treated by the use of a sling even when displacement is considerable."], correct: ["A", "D"], exp: "AC joint disruption results from direct forces to the top of the acromion. Stress/standing radiographs (often weight-bearing) assess displacement severity." },
            { id: 16, text: "The shoulder joint is:", options: ["Held together by a strong but thin capsular ligament which is lax superiorly", "Strengthened anteriorly by the subscapularis tendon", "Strengthened inferiorly by the infraspinatus tendon", "Strengthened superiorly by the supraspinatus tendon", "Weakest in the superior aspect"], correct: ["B", "D"], exp: "The rotator cuff reinforces the Glenohumeral joint: Subscapularis anteriorly, Supraspinatus superiorly, Infraspinatus/Teres minor posteriorly. Inferiorly, the capsule lacks musculotendinous reinforcement." },
            { id: 17, text: "The Bankart lesion is:", options: ["Fracture dislocation of the shoulder joint", "A tear in the capsule of the shoulder", "Detachment of the capsule of the shoulder joint from the scapula usually with the glenoid labrum", "A tear in the capsule of the shoulder joint and rotator cuff muscle tendons", "Detachment of the capsule of the shoulder joint from the humerus"], correct: ["C"], exp: "A Bankart lesion is avulsion of the anterior-inferior glenoid labrum along with the capsular attachment from the glenoid rim during anterior dislocation." },
            { id: 18, text: "A 40-year old man after falling on the outstretched hand has severe pain and tenderness in the right shoulder and supports the right elbow with the left hand. The right arm is found to be abducted and the tip of the shoulder flat. The most likely clinical diagnosis is:", options: ["Acromio-clavicular dislocation", "Posterior dislocation of the shoulder", "Fracture of the surgical neck of the humerus", "Anterior dislocation of the shoulder", "Fracture of posterior half of the head of the humerus"], correct: ["D"], exp: "Loss of normal rounded shoulder contour ('flattened shoulder'), holding the arm in slight abduction, following fall on outstretched hand points to Anterior Shoulder Dislocation." },
            { id: 19, text: "The lesion which is commonly associated with this injury is damage to the:", options: ["Median nerve", "Ulnar nerve", "Radial nerve", "Axillary nerve", "Brachial artery"], correct: ["D"], exp: "The axillary nerve winds around the surgical neck of the humerus in close proximity to the inferior glenoid, rendering it highly vulnerable in anterior dislocations." },
            { id: 20, text: "Complications of anterior dislocation of the head of the humerus include:", options: ["Injury of the axillary artery", "Injury to the supraspinatus and other rotator cuff muscle", "Fractures of the greater tuberosity", "Recurrent dislocations of the shoulder", "Injury to the pectoralis major"], correct: ["A", "B", "C", "D"], exp: "Anterior glenohumeral dislocation can cause axillary neurovascular injuries, rotator cuff tears, greater tuberosity avulsion fractures, and chronic instability." },
            { id: 21, text: "The pathological findings in recurrent dislocations of the shoulder include", options: ["Tear of the supraspinatus", "Postero-lateral notch in the humeral head", "Detachment of the glenoid labrum and capsule from the scapular neck", "Anterior pouch of the capsule under the coracoid process", "Laxity of the infraspinatus muscle"], correct: ["B", "C", "D"], exp: "Recurrent instability features Hill-Sachs lesions (posterolateral compression notch on humeral head), Bankart lesions (labral detachment), and anterior capsular laxity." },
            { id: 22, text: "In Kocher's manoeuver for reducing anterior dislocation of the shoulder:", options: ["The patient is placed supine on the couch", "The elbow is extended and a gentle traction applied on the arm while it is externally rotated fully", "The arm is then adducted sweeping the elbow across the body to the midline", "The arm is then internally rotated so that the hand falls near the opposite shoulder", "A collar and cuff sling is then applied"], correct: ["A", "C", "D"], exp: "Kocher's technique sequence (flexed elbow): Traction -> External rotation -> Adduction across chest -> Internal rotation onto opposite shoulder." },
            { id: 23, text: "The Bankart's operation is used for:", options: ["Luxatio erecta", "Posterior dislocation of the shoulder", "Fracture dislocation of the shoulder", "Fracture of the tuberosity of the humerus", "Recurrent dislocation of the shoulder"], correct: ["E"], exp: "Bankart repair reattaches the torn glenoid labrum and anterior capsule back to the anterior glenoid rim to restore stability in recurrent anterior shoulder dislocations." },
            { id: 24, text: "In a tear of the supraspinatus tendon, the typical feature is:", options: ["Tenderness over the shoulder", "Stiffness of the shoulder", "Inability to initiate abduction, but when abduction is passively initiated the patient is able to continue", "Inability to adduct the shoulder", "Palpable defect in the supraspinatus tendon"], correct: ["C"], exp: "Supraspinatus initiates early shoulder abduction (0-15°). When torn, patients cannot initiate abduction actively, but deltoid takes over once elevated passively past 15-30°." },
            { id: 25, text: "In the treatment of fractures of the surgical neck of the humerus", options: ["If the fracture is impacted, the arm is put in a sling and daily active assisted movements started", "If the fracture is impacted and the displacement is minimal, the arm is put in a plaster-of-Paris U-slab and strapped to the body for 3 weeks after which active assisted movements are started", "If displacement is severe, manipulation is done and the arm held in plaster-of-Paris shoulder Spica for 6 weeks.", "If there is associated dislocation of the head, open reduction is often necessary", "If the axillary nerve is injured, exploration and open reduction are urgent"], correct: ["A", "D"], exp: "Impacted proximal humerus fractures heal reliably with early sling support and prompt range-of-motion exercises. Fracture-dislocations usually necessitate open reduction." },
            { id: 26, text: "If a patient suspected of having fracture of the shaft of the right humerus is unable to extend the wrist and fingers, you will:", options: ["Suspect an associated fracture of the shafts of the radius and ulna", "Suspect associated injuries of the radial and ulnar nerves", "Suspect associated injury of the radial nerve", "Explore any nerve suspected to be injured and perform an open reduction of the fracture", "Treat the fracture by closed methods and splint the wrist and fingers in a position of function"], correct: ["C"], exp: "Wrist drop (inability to extend wrist and MCP joints) is classic for radial nerve palsy associated with mid-to-distal shaft humerus fractures (Holstein-Lewis lesion)." },
            { id: 27, text: "A child of 6 after falling on the outstretched hands has a painful tender swelling of the right elbow. You will:", options: ["Suspect MOST strongly separation of the medial epicondyle or dislocation of the elbow", "Check the radial pulse", "Examine for radial nerve injury", "Check the patient's ability to move the fingers", "Test for anaesthesia of the median and ulnar nerve distribution"], correct: ["B", "D", "E"], exp: "In paediatric elbow injuries (supracondylar fractures), immediate neurovascular assessment—checking radial pulse, capillary refill, and motor/sensory function of median, radial, and ulnar nerves—is vital." },
            { id: 28, text: "A girl of 6 who fell on the outstretched right hand presents with painful swelling of the elbow. She is unable to move the joint. The medial and lateral epicondyles and the point of the olecranon are normally related to each other. The most likely clinical diagnosis is:", options: ["Dislocation of the elbow", "Supracondylar fracture", "Fracture of the neck of the radius", "Fracture of the olecranon process", "Separation of the lateral condyle"], correct: ["B"], exp: "In supracondylar fractures, the distal humerus is broken above the condyles, leaving the triangular anatomic relationship of epicondyles and olecranon preserved (unlike elbow dislocation)." },
            { id: 29, text: "Your next step will be to:", options: ["Take an x-ray to confirm your diagnosis", "Examine the forearm for any neurological disorder", "Check the radial pulse", "Examine the shoulder for any lesion", "Check the brachial pulse"], correct: ["C"], exp: "Assessing distal vascular status by feeling the radial pulse is the most critical immediate physical examination priority in elbow injuries to rule out ischemia." },
            { id: 30, text: "After correcting the injury and immobilizing the arm, your next most important step will be to:", options: ["Do a check x-ray", "Examine the hand for swelling", "Check the radial pulse", "Check the brachial pulse", "Check for any neurological lesion"], correct: ["C"], exp: "Post-reduction verification of distal pulse (radial pulse) ensures that reduction or splintage has not compromised or entrapped the brachial artery." },
            { id: 31, text: "In a supracondylar fracture:", options: ["The lower fragment in 90% of patients is displaced backwards and upwards and may be rotated medially", "The brachial artery may uncommonly be injured and requires treatment within 6 hours of the injury", "Stiffness of the elbow is common and is treated by forced extension, passive movements and active exercises", "Mal-union is common and usually requires open reduction", "The median nerve is commonly injured"], correct: ["A", "B"], exp: "Extension-type supracondylar fractures (90%) exhibit posterior displacement. The anteriorly tented proximal fragment can compress or transect the brachial artery." },
            { id: 32, text: "In Volkmann's ischaemic contracture of the forearm:", options: ["The most common cause is supracondylar fractures of the humerus, but fractures of the shafts of the radius and ulna may also be a cause.", "The forearm muscles are fibrosed and contracted", "The fingers are stiff, contracted and clawed", "There is no loss of skin sensation", "Operative treatment is not necessary in most patients"], correct: ["A", "B", "C"], exp: "Volkmann contracture follows unmanaged compartment syndrome (often after supracondylar fractures), leading to muscular necrosis, fibrosis, joint flexion contractures, and neurological deficits." },
            { id: 33, text: "Myositis ossificans of the elbow:", options: ["Is a common complication of supracondylar fractures", "Presents as increasing immobility of the elbow a few weeks afer injury", "Gives rise to a painful and very stiff elbow", "Is treated by stretching of the elbow followed by passive and active movements", "Is best diagnosed by ultrasound imaging"], correct: ["A", "B", "C"], exp: "Heterotopic bone formation in periarticular soft tissues causes progressive stiffness and pain; passive stretching exacerbates inflammation and is strictly contraindicated." },
            { id: 34, text: "Fractures of the lateral condyle of the humerus:", options: ["Is common in adults and occasionally seen in children", "Is caused by direct violence on the elbow", "May lead to cubitus valgus and ulnar neuritis", "Usually requires open reduction for accurate reduction which is important", "Is often complicated by ulnar nerve injury"], correct: ["C", "D"], exp: "Lateral condyle fractures are paediatric intra-articular injuries requiring precise anatomical reduction. Mal-union/non-union leads to progressive cubitus valgus and tardy ulnar nerve palsy." },
            { id: 35, text: "A 20-year old man falls on the outstretched right arm. He complains of pain around the elbow and it is found that the olecranon is unusually prominent. The line from the medial epicondyle through the tip of the olecranon to the lateral epicondyle is angulated. The most likely clinical diagnosis is:", options: ["Supracondylar fracture", "Fracture of the olecranon process", "Dislocation of the elbow", "Monteggia fracture dislocation", "Fracture of the head of the radius"], correct: ["C"], exp: "Distortion of the classic equilateral triangle formed by epicondyles and olecranon tip confirms elbow dislocation (distal articular surfaces disrupted relative to humerus)." },
            { id: 36, text: "In dislocation of the elbow:", options: ["The cause is usually direct violence to the elbow", "The radius and ulna are displaced forward in relation to the condyles of the humerus", "The line from the medial epicondyle through the tip of the olecranon to the lateral epicondyle is straight", "A back slab is applied for 6 weeks after reduction", "Recurrence may be due to associated fracture of the coronoid process"], correct: ["E"], exp: "The coronoid process serves as an essential anterior bony buttress; its fracture destabilizes the elbow joint leading to recurrent instability." },
            { id: 37, text: "In fracture of the head of radius:", options: ["There is severe pain on the lateral aspect of the elbow", "Rotation-supination movements are particularly painful", "The radial artery may be damaged", "Treatment in all patients is surgical excision of the head", "Joint stiffness and osteoarthritis are common complications."], correct: ["A", "B", "E"], exp: "Radial head fractures produce lateral elbow pain aggravated by pronation/supination. Complications include elbow stiffness and secondary radiohumeral osteoarthritis." },
            { id: 38, text: "In fractures of the shafts of the radius and ulna:", options: ["An isolated fracture of the ulna or radius is unusual", "The entire shafts including the wrist and elbow joints should always be x-rayed", "The proximal fragments are pronated if the fractures are in the upper third", "If the fractures are below the mid-shaft, the proximal and distal fragments should be held in mid-pronation to get them in line", "Union usually occurs in the adult in 8-12 weeks"], correct: ["A", "B", "D", "E"], exp: "Forearm forearm bone injuries act as a two-bone frame; isolated fractures are uncommon without joint dislocation. Radiographs must capture both elbow and wrist joints." },
            { id: 39, text: "Features of Colles' fracture include:", options: ["Fracture of the distal 6cm of the radius", "Dorso-lateral displacement of the distal fragment", "Dorsal rotation of the distal fragment", "Fracture of the ulna styloid", "Falling on an outstretched hand"], correct: ["B", "C", "D", "E"], exp: "Colles' fracture is an extra-articular distal radius fracture within 2.5 cm of the wrist with dorsal displacement, dorsal tilt (rotation), radial shift, and styloid avulsion." },
            { id: 40, text: "Pain and swelling over the wrist following an injury may be due to:", options: ["Madelung's deformity", "Fracture of the radial styloid", "Fracture of the scaphoid", "Smith's fracture", "Monteggia fracture"], correct: ["B", "C", "D"], exp: "Acute traumatic wrist presentations stem from fractures of radial styloid, scaphoid, or distal radius variants like Smith's (volar displacement)." },
            { id: 41, text: "In a Colles' fracture:", options: ["The wrist is immobilized in palmar flexion and ulnar deviation after reduction", "An above elbow plaster is usually applied especially if the fracture is comminuted", "Immobilization is usually for 3-4 weeks", "Complications include reflex sympathetic dystrophy, shoulder-hand syndrome, rupture of the extensor pollicis longus tendon and Volkmann's ischaemic contracture of the fore-arm", "Is most common in middle-aged men"], correct: ["A"], exp: "Post-reduction stabilization of Colles' fracture classically relies on casting in palmar flexion and ulnar deviation ('Colles' cast position)." },
            { id: 42, text: "In Smith's fracture:", options: ["There is a fracture of the distal end of the radius", "The distal fragment is displaced posteriorly", "There is anterior rotation of the distal fragment", "The cause is a pronation injury produced on falling on the flexed wrist", "After reduction, an above elbow plaster is applied with the wrist in full supination and slight dorsiflexion"], correct: ["A", "C", "D", "E"], exp: "Smith's fracture ('reverse Colles') features volar/anterior displacement/tilt of the distal radius fragment, typically incurred from falling onto a flexed wrist." },
            { id: 43, text: "A Monteggia fracture is:", options: ["Transverse fracture of the upper third of the ulna", "Transverse fractures of the upper third of the ulna and lower third of the radius", "Transverse fracture of the lower third of the ulna with dislocation of the proximal radio-ulnar joint", "Transverse fracture of the upper third of the ulna with dislocation of the proximal radio-ulnar joint", "Transverse fracture of the upper third of the radius with dislocation of the inferior radio-ulnar joint."], correct: ["D"], exp: "Monteggia lesion consists of a fracture of the proximal third of the ulna shaft accompanied by dislocation of the radial head at the proximal radioulnar joint." },
            { id: 44, text: "A Monteggia fracture is:", options: ["Caused by a fall on the outstretched hand", "Produced by a blow on the forearm", "Markedly angulated either anteriorly or posteriorly", "Usually treated by closed manipulation and open reduction being necessary only occasionally", "If accompanied by fracture of the head of the radius in a child is treated by excision of the head of the radius and intramedullary nailing of the ulna"], correct: ["B", "C"], exp: "Direct blows to the forearm ('nightstick' defense mechanism) frequently cause Monteggia fractures with marked ulnar angulation." },
            { id: 45, text: "A Galleazzi fracture is:", options: ["Fracture of the radius with dislocation of the proximal radio-ulnar joint", "Produced by a blow on the forearm", "Treated by open reduction and plating", "Treated by closed manipulation", "Mobilized by a below-elbow plaster"], correct: ["B", "C"], exp: "Galeazzi fracture-dislocation comprises a fracture of the distal shaft of the radius with disruption of the distal radioulnar joint (DRUJ); rigid anatomical plate fixation is mandatory in adults." },
            { id: 46, text: "Fractures of the scaphoid:", options: ["Is produced by a direct blow on the carpus", "Typically causes pain and tenderness in the anatomical snuff box", "Is not always evident on x-ray", "May be complicated by avascular necrosis and osteoarthritis", "Is immobilized in a below-elbow plaster with the thumb in full internal rotation and the plaster extended to the metacarpo-phalangeal joint"], correct: ["B", "C", "D"], exp: "Scaphoid waist fractures present with anatomic snuffbox tenderness. Initial X-rays can miss non-displaced fractures. Retrograde blood supply risks avascular necrosis (AVN) of proximal pole." },
            { id: 47, text: "Kienbock's disease:", options: ["Is an insidious avascular necrosis of the scaphoid", "May be associated with trauma", "Causes paraesthesia of the hand", "Is usually seen in young adults", "Is usually seen in children"], correct: ["B", "D"], exp: "Kienböck's disease is osteonecrosis/avascular necrosis of the lunate carpal bone, typically affecting young adults (ages 20-40) often associated with repetitive microtrauma." },
            { id: 48, text: "Bennett's fracture:", options: ["Is a fracture-dislocation of the first metacarpal through the carpometacarpal joint", "Has the metacarpal displaced anteriorly and proximally on the carpal bone", "Is stable because the collateral ligament is not ruptured", "Is easy to reduce by manipulation but the reduction is difficult to maintain", "May necessitate arthrodesis"], correct: ["A", "D", "E"], exp: "Bennett's fracture is an intra-articular fracture-dislocation of the base of 1st metacarpal. Abductor pollicis longus pulls the main shaft proximally and dorsally, making unstable maintenance tricky." },
            { id: 49, text: "A rolled bandage held in the palm of the hand and held by a crepe bandage is used to immobilize:", options: ["Fractures of the phalanges", "Fractures of the metacarpals", "Fracture of the lunate", "Dislocation of the carpo-metacarpal joint", "Dislocation of the metacarpo-phalangeal joint"], correct: ["B"], exp: "Immobilizing metacarpal shaft fractures can be performed with functional ball-bandage flexed hand splinting to maintain palmar arch concavity." },
            { id: 50, text: "An x-ray shows a fracture of the shaft of the ulna, you will:", options: ["Reduce the fracture and apply a plaster of Paris cast", "Perform an open reduction and internal fixation", "Request an x-ray of the elbow to show the proximal radio-ulnar joint", "Request an x-ray of the wrist", "Request an x-ray of the whole shaft including the elbow and wrist joints"], correct: ["E"], exp: "Single forearm bone fractures are notorious for masking dislocation of adjacent joints (Monteggia/Galeazzi); full length radiographs including wrist and elbow are required." },
            { id: 51, text: "Which of the following is true of fractures of the phalanges?", options: ["The distal phalanx is fractured more commonly than the proximal and middle phalanges", "The deformity in the shaft fractures of the proximal phalanx is flexion of the proximal fragment from the pull of the interossei and the lumbricals", "Fractures of the middle phalanx are usually not displaced", "Undisplaced fractures of the proximal phalanx are immobilized in a plaster of Paris from the wrist to the tip of the finger", "Displaced fractures of the middle or proximal phalanx are reduced by traction and flexion of the finger over a roll of cotton gauze and held down by cotton gauze"], correct: ["B", "C", "E"], exp: "Interosseous muscles flex the proximal fragment of proximal phalanx fractures. Flexion over a palmar roll maintains functional reduction." },
            { id: 52, text: "In mallet finger:", options: ["The terminal phalanx is held in flexion deformity", "The terminal phalanx cannot be flexed", "The flexor tendon avulses a portion of the terminal phalanx at its insertion", "The finger is immobilized in a splint with the proximal interphalangeal joint flexed and the distal interphalangeal joint hyperextended for 3 weeks", "If a large portion is avulsed then operative excision is necessary"], correct: ["A", "D"], exp: "Mallet finger results from extensor tendon disruption at DIP joint causing flexed resting posture. Continuous hyperextension splinting of DIP joint for 6-8 weeks is standard." },
            { id: 53, text: "A patient is suspected of having a fracture of the scaphoid. X-ray is negative. You will:", options: ["Leave the patient alone", "Apply strapping of the wrist for 3 weeks", "Apply a scaphoid plaster for 2 weeks and repeat the x-ray", "Apply a splint to the wrist and repeat the x-ray after 2 weeks", "Apply a scaphoid plaster for 8 weeks"], correct: ["C"], exp: "Clinical suspicion of scaphoid fracture with initial negative X-rays warrants scaphoid cast immobilization and repeat radiographs in 10-14 days when resorption reveals the fracture line." },
            { id: 54, text: "Falling on the outstretched hand may result in:", options: ["Fracture of the scaphoid", "Dislocation of the lunate", "Fracture of the radial head", "Smith's fracture", "Monteggia fracture"], correct: ["A", "C"], exp: "FOOSH (fall on outstretched hand) classic injuries include scaphoid fractures, radial head fractures, and Colles' fractures." },
            { id: 55, text: "Falling on the outstretched hand may result in fracture of the:", options: ["Clavicle", "Shaft of the humerus", "Surgical neck of the humerus", "Oleranon", "Shafts of the radius and ulna"], correct: ["A", "C", "E"], exp: "Axial transmission of impact force from FOOSH travels up the kinetic chain causing fractures of distal radius/ulna, surgical neck of humerus, or clavicle." },
            { id: 56, text: "A man of 25 standing with his face to a wall is squashed from behind by a reversing car. He complains of severe pain around the pelvis and is unable to stand. His pulse is 100bpm, regular and of moderate volume and the blood pressure is 100/60mmHg. The most likely clinical diagnosis is:", options: ["A vertical fracture of the pubic ramus and ischium on one side", "Hinge-separation of the symphysis pubis", "A vertical fracture of the pubis and ischium and a vertical fracture of the ilium all on both sides", "A vertical fracture of the pubic ramus and ischium on both sides", "A vertical fracture of the pubic ramus and ischium and hinge separation of the symphysis"], correct: ["B"], exp: "Anteroposterior compression (APC) pelvic injury secondary to crush mechanisms leads to open book separation of the pubic symphysis hinged on posterior sacroiliac structures." },
            { id: 57, text: "Which of the following complications may occur?", options: ["Sciatic nerve palsy", "Rupture of the bladder", "Perforation of the stomach", "Paralytic ileus", "Rupture of the urethra"], correct: ["B", "D", "E"], exp: "Pelvic ring disruptions are frequently complicated by lower urinary tract lesions (membranous urethral or bladder rupture) and retroperitoneal hematoma leading to paralytic ileus." },
            { id: 58, text: "After confirming the diagnosis by x-ray you will:", options: ["Apply a short hip spica", "Apply a full hip spica", "Leave the patient free in bed and encourage active moments of the spine and hips", "Put the pelvis in a Bryant pelvic sling and suspend it from an overhead beam", "Apply skeletal traction through the tibia"], correct: ["C"], exp: "Isolated stable pubic symphysis diastasis without mechanical pelvic ring instability can be managed conservatively with bed rest and early active mobilization as tolerated." },
            { id: 59, text: "Relaxation of which of the following muscles causes shortening and displacement in intra-capsular fractures of the hip?", options: ["Gluteus maximus", "Gluteus medius", "Piriformis", "Superior gamelli", "Obturator internus"], correct: ["B"], exp: "Unopposed pull of gluteus medius and iliopsoas muscles leads to external rotation and proximal displacement (shortening) of the distal femoral shaft." },
            { id: 60, text: "A 30-year old woman in the front seat of a car injures her right hip following an accident involving the car. The right leg is shortened, internally rotated, flexed and adducted. The most likely clinical diagnosis is:", options: ["Basal fracture of the femur", "Subcapital fracture of the femur", "Posterior dislocation of the hip", "Anterior dislocation of the hip", "Central dislocation of the hip"], correct: ["C"], exp: "The classic posture of posterior hip dislocation ('dashboard injury') is flexion, adduction, internal rotation, and leg shortening." },
            { id: 61, text: "Which of the following complications may occur?", options: ["Sciatic nerve palsy", "Osteoarthritis of the hip", "Rupture of the femoral artery", "Myositis ossificans", "Fracture of the anterior lip of the acetabulum"], correct: ["A", "B", "D"], exp: "Posterior hip dislocation risks sciatic nerve compression/traction injury, avascular necrosis leading to secondary osteoarthritis, and periarticular myositis ossificans." },
            { id: 62, text: "In anterior dislocation of the hip:", options: ["The hip is slightly extended", "The hip is abducted", "The hip is externally rotated", "The limb appears lengthened because the head of the femur lies at a slightly lower level than the acetabulum", "The limb appears shortened and internally rotated"], correct: ["B", "C", "D"], exp: "Anterior hip dislocations present with external rotation, abduction, and apparent lengthening of the involved lower limb." },
            { id: 63, text: "Fracture of the neck of femur:", options: ["Is most common in elderly men especially over 70", "Is aetiologically most often associated with osteoporosis", "Is usually caused by severe violence in the young and elderly", "Results in pulling of the lesser trochanter upwards and forwards by the psoas muscle", "Usually produces no deformity"], correct: ["B", "D"], exp: "Femoral neck fractures occur predominantly in osteopenic/osteoporotic elderly women. Iliopsoas pulling on the lesser trochanter causes characteristic short external rotation deformity." },
            { id: 64, text: "A 75-year old lady stumbles and falls down. She experiences pain in the right groin and is unable to raise the leg. The leg is found on examination to be shortened and externally rotated. The clinical diagnosis may be:", options: ["Subcapital fracture of the femur", "Transcervical fracture of the femur", "Basal fracture of the femur", "Intertrochanteric fracture of the femur", "Anterior dislocation of the hip"], correct: ["A", "B", "C", "D"], exp: "All intracapsular and extracapsular proximal femoral fractures (subcapital, transcervical, basal, intertrochanteric) cause inability to weight-bear, limb shortening, and external rotation." },
            { id: 65, text: "Avascular necrosis and/ or non-union is a problem in:", options: ["Basal fracture of the femur", "Sub trochanteric fracture of the femur", "Transcervical fracture of the femur", "Intertrochanteric fracture", "Anterior dislocation of the hip"], correct: ["C", "E"], exp: "Intracapsular femoral neck fractures (transcervical) and hip dislocations disrupt retinacular blood vessels supplied by lateral femoral circumflex artery, inducing femoral head AVN." },
            { id: 66, text: "Non-union of fracture of the neck of the femur in an elderly woman is BEST treated by:", options: ["Full hip spica", "Hemi-arthroplasty", "Dynamic hip screw", "MacMurray's osteotomy", "Insertion of a bone graft"], correct: ["B"], exp: "In elderly patients with non-union or displaced femoral neck fractures, replacement arthroplasty (hemi-arthroplasty or THA) provides rapid weight-bearing mobilization." },
            { id: 67, text: "In the treatment of fractures of the neck of the femur:", options: ["Transcervical fracture in patients under 70 is treated with cancellous hip screws", "Displaced Transcervical fractures in patients over 70 is best treated by a hemi-arthroplasty or by a total hip replacement", "A basal fracture is best treated by internal fixation with a dynamic hip screw", "Intertrochanteric fracture in the young is immobilized with a full hip spica", "Subcapital fractures in the young is treated by total hip replacement"], correct: ["A", "B", "C"], exp: "Head preservation with cancellous screw fixation is preferred in young patients (<70). Arthroplasty is indicated in elderly displaced cases. Extracapsular fractures use Dynamic Hip Screws (DHS)." },
            { id: 68, text: "Avascular necrosis of the head of the femur:", options: ["Is uncommon after the Subcapital fracture of the neck", "Follows badly treated fracture of the neck of femur", "Is influenced by weight bearing forces", "Causes severe groin pain when lying down", "Radiologically has a glossy ground-glass appearance in the early stages"], correct: ["E"], exp: "Early radiological findings in osteonecrosis include subchondral radiolucency/sclerosis and ground-glass opacity prior to femoral head segmental collapse." },
            { id: 69, text: "Avascular necrosis of the head of the femur may be treated by:", options: ["Analgesics and rest", "Physiotherapy", "Replacement of the head by a prosthesis", "Total hip replacement", "Arthrodesis of the hip"], correct: ["B", "C", "D"], exp: "Surgical reconstruction options for collapsed AVN include modular hemiarthroplasty, total hip replacement, core decompression, or joint realignment." },
            { id: 70, text: "A car knocks down a 30-year old man. He complains of severe pain in the left thigh and is unable to raise the leg. Examination reveals deformity and swelling of the thigh with flexion, abduction and external rotation of the proximal part of the thigh. The fracture of the femur is at the:", options: ["Greater tuberosity", "Upper third", "Middle third", "Lower third", "Supracondyles"], correct: ["B"], exp: "Proximal third femoral fractures feature characteristic displacement: proximal fragment is flexed (iliopsoas), abducted (gluteus medius/minimus), and externally rotated (short rotators)." },
            { id: 71, text: "Which of the following may occur?", options: ["Injury to the popliteal artery", "Injury to the femoral artery", "Injury to the popliteal nerves", "Injury to the sciatic nerve", "Shock"], correct: ["E"], exp: "Femoral shaft fractures routinely cause major closed internal occult blood loss (1000-1500ml), predisposing patients to hemorrhagic hypovolemic shock." },
            { id: 72, text: "Indications for internal fixation of a fracture of the shaft of the femur include:", options: ["Old or frail patients", "Patients between 5 and 12", "Patients with multiple injuries to the lower limb", "Pathological fractures from metastasis", "Angulation of the fractured fragments"], correct: ["A", "C", "D"], exp: "Surgical stabilization (intramedullary nailing/plating) is indicated for polytrauma, pathologic lesions, and adults/elderly unable to tolerate prolonged traction immobilisation." },
            { id: 73, text: "A Gallow's splint is used in children for treating fracture of the:", options: ["Tibia and fibula", "Supracondylar region of the femur", "Shaft of the femur", "Neck of femur", "Anterior dislocation of the hip"], correct: ["C"], exp: "Gallows overhead skin traction is utilized for pediatric femoral shaft fractures in infants and young children under 2 years of age (<15kg)." },
            { id: 74, text: "A 25-year old man is suspected of having a supracondylar fracture of the right femur. You will:", options: ["Check the popliteal pulse", "Examine the lower leg for any lesion of the sciatic nerve", "Check the dorsalis pedis pulse", "Check the femoral pulses", "Check movement of the bones"], correct: ["C"], exp: "The distal femoral fragment in supracondylar fractures tilts posteriorly due to gastrocnemius pull, risking compression/laceration of the popliteal artery. Checking dorsalis pedis pulse verifies distal perfusion." },
            { id: 75, text: "Supracondylar fracture of the femur is treated by:", options: ["Manipulation and application of above knee plaster", "Manipulation and application of a full hip spica", "Open reduction and fixation with a blade plate", "Open reduction and intramedullary nailing", "Weight traction on the leg by skin or skeletal traction"], correct: ["C"], exp: "Displaced supracondylar femoral fractures in adults require rigid internal fixation (e.g., fixed-angle blade plates, distal femoral locking plates, or retrograde intramedullary nails)." },
            { id: 76, text: "In the treatment of fracture of the patella:", options: ["A comminuted fracture is best treated in a patient under 40 by immobilization of the knee in a plaster cylinder for 6 weeks and in a patient over 40yrs by patellectomy", "A transverse fracture in a patient under 40 is best treated by excision of the patella", "A transverse fracture in a patient over 40 is treated by operative reduction and fixation of the fragments with screws", "A crack fracture in a patient under 40 is best treated by aspiration of haemarthrosis and immobilization of the knee in a plaster cylinder for 6 weeks", "A crack fracture in a patient over 40 is best treated by bed rest and early mobilization"], correct: ["D"], exp: "Undisplaced/crack patellar fractures with intact extensor mechanism respond well to aspiration of hemarthrosis followed by 6 weeks of knee cylinder cast immobilization." },
            { id: 77, text: "Which of the following disabilities of the knee may occur after excision of the patella?", options: ["Slight reduction in extension", "Some reduction in flexion", "Slight disability in climbing stairs", "Slight disability in descending stairs", "Locking of the knee"], correct: ["A", "B", "C", "D"], exp: "Patellectomy reduces the mechanical lever arm of the extensor mechanism, resulting in 15-30% loss of quadriceps power, mild range-of-motion loss, and difficulty climbing/descending stairs." },
            { id: 78, text: "Which of the following muscles maintain the knee in the extended position during walking?", options: ["Popliteus", "Rectus femoris", "Vastus medialis", "Gracilis", "Vastus lateralis"], correct: ["B", "C", "E"], exp: "The components of Quadriceps femoris (rectus femoris, vastus medialis, vastus lateralis, vastus intermedius) maintain active knee extension during stance phase." },
            { id: 79, text: "Which of the following is/are true of the ligaments of the knee?", options: ["The lateral collateral ligament is more commonly ruptured than the medial collateral ligament", "In rupture of the medial collateral ligament the knee is unstable on adduction", "Medial collateral ligament rupture is usually treated by applying a knee brace for 6 weeks", "The anterior cruciate ligament is ruptured by an extension force driving the tibia forwards relative to the femur", "Anterior cruciate ligament rupture is treated by surgical reconstruction"], correct: ["C", "D", "E"], exp: "MCL tears heal reliably in functional knee braces. ACL prevents anterior tibial translation; tears in young active patients require surgical autograft reconstruction." },
            { id: 80, text: "Which of the following is/are true of tears of the menisci?", options: ["As the medial meniscus is attached to the medial collateral ligament, it is less commonly torn than the lateral meniscus", "They occur if the semi-flexed knee is twisted while weight-bearing", "In the bucket handle tear, the commonest, the tear extends into both horns and the fragment is displaced inwards", "They cause haemarthrosis", "They may heal spontaneously"], correct: ["B", "C"], exp: "Meniscal tears occur when rotational torque is applied to a weight-bearing flexed knee. Bucket-handle tears displace medially into the intercondylar notch, causing mechanical joint locking." },
            { id: 81, text: "Clinical features of acute tears of the medial meniscus include:", options: ["Inability of the patient to straighten the knee fully after injury to the knee", "Swelling of the knee", "Wasting of the quadriceps muscle", "Attempted passive extension of the knee causes pain in the whole knee", "Appley's grinding test is positive"], correct: ["A", "B", "E"], exp: "Classic features of acute meniscus tear: Joint effusion (swelling), true mechanical locking (inability to fully extend knee), and positive Apley's compression/grinding test." },
            { id: 82, text: "Which of the following is/are true of fracture of the lateral condyle of the tibia?", options: ["It is less common than that of the medial condyle", "Oblique shearing fractures should always be treated conservatively", "A comminuted compression fracture is treated by Hamilton Russell skin traction and knee exercises", "Depressed plateau fracture is treated by open reduction in the young", "It may lead to genu varum"], correct: ["D"], exp: "Depressed tibial plateau fractures in young active patients require open reduction, elevation of articular surface, bone grafting, and plate fixation to restore joint congruity." },
            { id: 83, text: "Which of the following is/are true of fractures of the tibia and fibula?", options: ["Fracture of the tibia is always accompanied by the fracture of the fibula", "Oblique fractures are unstable and tend to shorten and displace in plaster even when the initial reduction is good", "Shortening may be overcome by skeletal traction using a Steinman's pin through the calcaneum", "The full-length leg plaster extends from the mid-thigh to the metatarsal heads with the knee slightly flexed at about 10° and the ankle at 90°", "It is not essential to examine the leg for circulatory impairment when the patient is first seen as pressure on blood vessels and nerves is caused by tight dressing or plaster cast"], correct: ["B", "C"], exp: "Oblique tibial fractures lack intrinsic cortical stability and prone to shortening. Calcaneal/distal tibial pin skeletal traction counteracts muscle spasm." },
            { id: 84, text: "Indications for open reduction and internal fixation in fractures of the tibia and fibula include:", options: ["Fractures of the lower third of the tibia", "Overlap causing mal-union", "Mal-union from angulation", "Oblique fracture", "Delayed union"], correct: ["A", "B", "C"], exp: "Distal third tibial fractures have poor blood supply. Operative intervention corrects persistent angulatory deformity, shortening overlap, and articular instability." },
            { id: 85, text: "Which of the following injuries of the ankle is/are stable?", options: ["Complete rupture of the lateral ligament", "Spiral fracture of the lateral malleolus", "Spiral fracture of the lateral malleolus with avulsion fracture of the medial malleolus (bimalleolar fracture)", "Avulsion fracture of the medial malleolus", "Spiral fracture of the lateral malleolus with avulsion fracture of the posterior part of the lower end of the tibia (tri-malleolar fracture)"], correct: ["B", "D"], exp: "Isolated unilevel malleolar injuries (isolated spiral lateral malleolus or simple avulsion medial malleolus without deltoid/syndesmotic disruption) are inherently stable." },
            { id: 86, text: "Abduction-lateral rotation injuries of the ankle include:", options: ["Avulsion fracture of the tip of the lateral malleolus", "Anterior marginal fracture of the lower end of the tibia with anterior shift of the talus", "Avulsion fracture of the medial malleolus with spiral fracture of lateral malleolus", "Isolated shearing fracture of the medial malleolus", "Shearing fracture of the medial malleolus with transverse fracture of the lateral malleolus"], correct: ["C"], exp: "Pronation-external rotation/abduction forces produce medial tension (medial malleolus avulsion / deltoid tear) combined with spiral high lateral malleolar/fibular fracture." },
            { id: 87, text: "A middle-aged man while playing tennis experiences a sudden pain behind the right ankle. He is unable to plantar flex the foot or support the body on the toes. The most likely injury is:", options: ["Fracture of the lower end of the tibia", "Tear of the posterior ligament of the ankle", "Rupture of the Achilles tendon", "Tear of the gastrocnemius muscle", "Tear of the tibialis posterior muscle"], correct: ["C"], exp: "Sudden 'pop' behind ankle during pushing-off in racquet sports, loss of active plantarflexion, and inability to tip-toe stand are diagnostic of acute Achilles tendon rupture." },
            { id: 88, text: "A patient falls from a height and is found to have a fracture of the calcaneus. Which of the following may also be fractured?", options: ["Lower tibia", "Pelvis", "Lower thoracic spine", "Lumbar spine", "Basi-occiput"], correct: ["A", "B", "C", "D", "E"], exp: "High-energy axial loading (fall from height) transmits vertical impact upward through kinetic chain: Calcaneus -> Tibial plateau -> Femur/Pelvis -> Lumbar/Thoracic spine -> Skull base." },
            { id: 89, text: "A 30-year old farmer is carrying a heavy load on her trips and the load falls backwards from the head. She may sustain:", options: ["Fracture of a spinous process of a cervical vertebra", "Fracture of the lamina of a cervical vertebra", "Fracture dislocation of the cervical spine with injury to the cord", "Wedge compression fracture of the body of a cervical vertebra", "Avulsion fracture of the anterior-inferior border of a cervical vertebra (tear drop)"], correct: ["A", "B", "C", "E"], exp: "Hyperextension forces combined with sudden backward traction can cause avulsion of spinous processes (Clay-shoveler's), pedicle/laminar fractures, tear-drop fractures, and cord injury." },
            { id: 90, text: "In injuries of the spine:", options: ["Cord injury without radiological evidence of vertebral injury is indicative of extension-rotation injury", "Wedge compression fracture occurs in pure extension injury and is stable", "Wedge compression fracture is commonest in the thoracic region", "Contusion on the forehead suggests an extension injury", "Fracture dislocation at T12-L1 is stable"], correct: ["A", "C", "D"], exp: "SCIWORA is linked with extension-flexion injuries. Forehead contusions signify hyperextension mechanisms. Anterior wedge compression fractures predominate in the thoracic spine." },
            { id: 91, text: "In paraplegia following spinal injury:", options: ["Normal bladder function usually returns after 3 months", "Diarrhoea often occurs", "Violent flexor and adductor spasm of the paralyzed limbs may occur", "Spirit applied daily to the skin prevents pressure sores", "There should be daily passive movements of all paralyzed joints and the unaffected upper limb muscles"], correct: ["C"], exp: "Spinal shock resolution leads to emergence of upper motor neuron spasticity, manifested by involuntary flexor/adductor spasms in paralyzed lower extremities." },
            { id: 92, text: "A 7-year old boy is rushed into the emergency room with a swollen, painful and deformed left elbow. He had fallen off from his school desk about 3 hours ago. Concerning management:", options: ["A pulsating hematoma in the cubital fossa is a hard sign of a brachial artery injury", "A supracondylar fracture is the most likely working diagnosis", "Compartment syndrome is not a possible complication of this injury", "An on-table angiogram is indicated if the pulses are found to be diminished with a sluggish capillary refill", "Definite treatment will involve closed manipulation and application of a completed above elbow plaster of Paris cast."], correct: ["A", "B", "D"], exp: "Pulsating cubital fossa hematoma is a hard sign of vascular injury. Supracondylar fractures are the most common paediatric elbow injury. Diminished perfusion requires immediate reduction / angiography." },
            { id: 93, text: "Long term complications of this injury includes:", options: ["Cubitus varus", "Volkmann's ischemic contractures", "Heterotopic ossification", "Stiffness at the elbow joint", "Cubitus valgus"], correct: ["A", "B", "C", "D", "E"], exp: "Supracondylar fracture long-term sequelae encompass angular deformities (gunstock/cubitus varus, cubitus valgus), Volkmann contracture, stiffness, and heterotopic ossification." },
            { id: 94, text: "A 20-year-old male pillion rider in a motorcycle accident has GCS 12, femur fracture, and blood at urethral meatus. Mandatory 'trauma series' x-rays include:", options: ["Skull x-rays", "Chest x-rays", "Cervical spine x-rays", "Lumbar spine x-rays", "Pelvic x-rays"], correct: ["B", "C", "E"], exp: "Standard ATLS initial resuscitation trauma radiograph series consists of: AP Chest, AP Pelvis, and Lateral Cervical Spine." },
            { id: 95, text: "Pelvic x-rays done show grossly displaced fractures of the pelvis.", options: ["You will pass a 24g Foley's catheter if he goes into acute urinary obstruction", "An intravenous urogram is indicated to make a diagnosis of urethral rapture", "A paralytic ileus is a complication that arises from a retroperitoneal hematoma which is best treated by surgical evacuation", "A pelvic external fixator when applied helps to stabilize the pelvis and reduce hemorrhage", "The mortality rate from pelvic fractures is about 20%"], correct: ["D", "E"], exp: "Pelvic stabilization via external fixator or binder reduces pelvic volume, tamponading retroperitoneal bleeding. High-energy pelvic ring disruption carries ~15-20% mortality." },
            { id: 96, text: "In the management of open fractures of the tibia", options: ["Primary suturing of the soft tissue is recommended to prevent further contamination of the fracture", "External fixation of the fracture is not recommended if the wound is less than a centimeter in diameter", "Fracture healing will be delayed if there is extensive stripping of soft tissue like muscle and periosteum", "Wound swabs at the time of debridement is taken to determine any bacterial contamination", "Penicillin should be used as prophylaxis against osteomyetitis"], correct: ["C"], exp: "Periosteal and muscular soft tissue stripping devitalizes bone fragments, directly predisposing to non-union and delayed union." },
            { id: 97, text: "The following are complications that can occur following the treatment of a Colles' fracture except:", options: ["Reflex Sympathetic Dystrophy", "Frozen shoulder", "Carpal tunnel syndrome", "Stiff wrist joint", "Mal-union"], correct: ["C"], exp: "While median nerve compression can occur, acute carpal tunnel syndrome is less characteristic as an isolated classic delayed complication compared to RSD, shoulder stiffness, and malunion." },
            { id: 98, text: "A 75year old lady presents with an intracapsular fracture of right hip undergoing hemiarthroplasty:", options: ["Her risk of deep vein thrombosis (DVT) is 70% if no prophylaxis is given against it.", "Aspirin at a high dose of 300mg daily is recommended for prevention of DVT", "The advantage of warfarin is that it has rapid onset of action and does not require monitoring", "A prior history of DVT does not increase her risk of a new clot", "General anesthesia is superior to regional anesthesia for the on table prevention of DVT during hip fracture surgery"], correct: ["A"], exp: "Without pharmacologic thromboprophylaxis, total DVT incidence following major hip surgery/hip fracture reaches 50-70%." },
            { id: 99, text: "A 19yr old student presents with anterior dislocation of right shoulder in a basketball game:", options: ["Damage to the axillary nerve will present as decreased sensation at the point of the shoulder", "Open reduction of the shoulder is the definitive management", "The risk of recurrent dislocation of the shoulder joint is higher in patients below the age of 20yrs", "Bankart's lesion is a tear in the anterior capsule of the shoulder joint", "The mechanism of injury is usually by a posteriorly directed force to the shoulder in abduction and external rotation"], correct: ["A", "C", "E"], exp: "Axillary nerve innervation provides sensation over regimental badge area (deltoid). Recurrent dislocation rates exceed 80-90% in young patients under 20." },
            { id: 100, text: "In the management of supracondylar fractures of the humerus in children", options: ["Limb shortening due to premature physeal closure is a common complication", "An angiogram is indicated where there is suspicion of a compartment syndrome", "Closed reduction of the fracture with percutaneous pinning with kirschner wires is recommended for displaced fractures", "Injury to the ulnar nerve is a common complication", "Cubitus varus also referred to as a 'gunstock' deformity is a late complication"], correct: ["C", "E"], exp: "Gartland Type II/III displaced supracondylar fractures are treated with closed reduction and percutaneous K-wire fixation. Malunion results in cubitus varus (gunstock deformity)." }
        ];

        const RAW_DATA_CH54 = [
            { id: 1, text: "In the anatomy of bone:", options: ["The metaphysis is the part of the diaphysis adjoining the epiphyseal plate", "The actively growing segment of the bone is the epiphysis", "The periosteum ensheaths the bone and is made up of fibrous tissue capable of laying down bone", "Bone is made up of bone cells in a matrix of mineralized osteoid", "The diaphysis is the site of origin of most diseases of the bone"], correct: ["A", "D"], exp: "The metaphysis adjoins the epiphyseal physis plate. Mineralized osteoid matrix housing osteocytes, osteoblasts, and osteoclasts forms structural bone." },
            { id: 2, text: "In bone:", options: ["There is no lymphatic drainage", "The nerve supply is rich in the periosteum and scanty in the rest of the bone", "The circulus vasculosus of Hunter supplies the metaphysis", "The Harvesian system (concentric cylindrical tubes centered on blood vessels) is found in compact and cancellous bone", "The cancellous bone is the initial site of osteomyelitis or myeloma"], correct: ["B", "E"], exp: "Periosteum contains a rich sensory nerve supply. Cancellous trabecular bone with vascular marrow is the primary site of origin for hematogenous osteomyelitis and plasma cell dyscrasias." },
            { id: 3, text: "The rate of formation and breakdown of bone is influenced by:", options: ["Vitamin B", "Exercise", "Mineralo-corticoids", "Level of serum calcium", "Calcitonin"], correct: ["B", "E"], exp: "Mechanical loading (exercise) stimulates osteoblastic bone remodeling. Calcitonin directly inhibits osteoclast-mediated resorption." },
            { id: 4, text: "Bone:", options: ["Contains about 90% of the calcium in the body", "Contains about 85% of the phosphate in the body", "Resorption is enhanced by calcitonin", "Contains magnesium, carbonate and chloride but no fluoride", "Formation stops in old age"], correct: ["B"], exp: "Approximately 85% of total body phosphorus and 99% of total body calcium are stored within the skeletal hydroxyapatite bone matrix." },
            { id: 5, text: "Calcium:", options: ["Mobilization from bone is enhanced by parathormone", "Excretion by the renal tubules is stimulated by dihydroxy-chole-calciferol", "Excretion by the renal tubules is stimulated by parathormone", "Absorption from the intestine is stimulated by calciferol", "Absorption from the intestine is stimulated by calcitonin"], correct: ["A"], exp: "Parathyroid hormone (PTH) stimulates osteoclast activity and osteolysis to mobilize calcium from bone into circulation." },
            { id: 6, text: "Synovial joints include:", options: ["Syndesmosis", "Ellipsoid joint", "Pivot joint", "Gomphosis", "Amphiarthrosis"], correct: ["B", "C"], exp: "Ellipsoid (condyloid) and pivot (trochoid) joints are true synovial joints with fluid-filled articular cavities." },
            { id: 7, text: "Concerning joints:", options: ["The co-efficient of friction is very low and equals that of ice", "The articular cartilage is avascular and depends on synovia and sub-chondral osseous blood supply for nutrition", "A detached articular cartilage does not grow", "Synovia makes the articular cartilage the slipperiest surface known", "Joint space seen on x-ray is the space between the articular cartilages"], correct: ["B", "D"], exp: "Articular cartilage is avascular/aneural, nourished via synovial fluid diffusion. Synovial fluid lubrication delivers extraordinarily low friction coefficients." },
            { id: 8, text: "Which of the following is/are transmitted by dominant genes:", options: ["Sickle cell disease", "Achondroplasia", "Haemophilia", "Congenital dislocation of the hip", "Talipes equino-varus"], correct: ["B"], exp: "Achondroplasia is inherited as an Autosomal Dominant trait (FGFR3 gene mutation) with complete penetrance." },
            { id: 9, text: "In the grading of muscle power according to the Medical Research Council classification grade:", options: ["3 is movement with gravity eliminated", "1 is no flicker", "5 is normal power", "2 is movement against gravity", "4 is movement against resistance"], correct: ["C", "E"], exp: "MRC Muscle Scale: Grade 0 (None), 1 (Flicker), 2 (Gravity eliminated), 3 (Against gravity), 4 (Against moderate resistance), 5 (Normal power)." },
            { id: 10, text: "In the examination of the hip joint:", options: ["True shortening is found by measuring the distance between the anterior superior iliac spine and the medial malleolus with the pelvis level", "Apparent shortening is found by measuring the distance between the symphysis pubis and the medial malleolus with the pelvis level", "If apparent shortening is equal to true shortening then there is no abduction deformity", "Flexion deformity is measured as the angle at the beginning of movement", "It is always essential to measure Bryant's triangle to estimate a raised greater trochanter"], correct: ["A", "D"], exp: "True leg length discrepancy is measured from ASIS to medial malleolus with pelvis squared. Fixed flexion contracture is evaluated via Thomas test." },
            { id: 11, text: "In the examination of the hip and lower limb:", options: ["A positive Trendelenburg's test indicates a stable hip", "A raised greater trochanter is seen in a dislocated hip", "Nelaton's line is undisturbed in coxa vara", "Abduction to 90° is possible in a normal adult hip", "The level of the pelvis is not of any significance"], correct: ["B"], exp: "Proximal migration of the greater trochanter above Nélaton's line occurs in posterior hip dislocations, coxa vara, and un-united femoral neck fractures." },
            { id: 12, text: "The following lines/signs assist in the assessment of the hip on x-rays:", options: ["Perkin's lines", "Pauwell's lines", "McMurrays's sign", "Trethowan's sign", "Shenton's line"], correct: ["A", "B", "D", "E"], exp: "Radiographic hip reference lines include Perkin's line, Pauwel's angle of fracture orientation, Trethowan's sign (DDH/SUFE), and Shenton's continuous arch." },
            { id: 13, text: "A 10-year old boy presenting with acute upper tibial tenderness, fever 40°C, and systemic toxicity. The most likely clinical diagnosis is:", options: ["Fracture of the upper end of the tibia", "Cellulitis", "Septic arthritis of the knee", "Osteomyelitis of the upper end of the tibia", "Haematoma"], correct: ["D"], exp: "Acute metaphyseal localized tenderness in a child accompanied by high fever and systemic toxicity is classic for acute hematogenous osteomyelitis." },
            { id: 14, text: "The diagnosis can be confirmed by:", options: ["X-ray of the lower leg and knee", "Haemoblobin, white blood cell and differential", "Erythrocyte sedimentation rate (ESR)", "Repeated blood cultures", "Aspiration"], correct: ["D"], exp: "Isolation of the causative pathogen (Staph aureus) via blood cultures or subperiosteal bone aspiration provides definitive microbiological diagnosis." },
            { id: 15, text: "An x-ray of the leg and knee in acute osteomyelitis (<10 days) will show:", options: ["New bone formation and elevated periosteum", "Loss of joint space", "Osteolysis", "Fracture", "No bony abnormality"], correct: ["E"], exp: "Plain radiographs remain normal during the first 7-14 days of acute osteomyelitis before periosteal reaction or lytic changes become visible." },
            { id: 16, text: "Treatment will include:", options: ["Full leg plaster of Paris and analgesics", "Bed rest, splintage of the leg in a Thomas' splint and analgesics", "Cloxacillin and ampicillin intravenously for 5 days followed by oral administration for up to 6 weeks", "Aspiration of the knee", "Intravenous fluids and/or blood transfusion"], correct: ["B", "C", "E"], exp: "Standard therapy for acute osteomyelitis: High-dose empirical parenteral antistaphylococcal antibiotics, limb immobilization/splinting, and supportive hydration." },
            { id: 17, text: "Acute haematogenous osteomyelitis:", options: ["Is most commonly caused by staph pyogenes", "Is associated with trauma in a few patients and overt septic skin lesion in the majority", "In children commonly starts in the diaphysis", "In Africa has a higher incidence among sicklers", "Always leads to the formation of a sequestrum"], correct: ["A", "D"], exp: "Staphylococcus aureus is the predominant organism. Patients with Sickle Cell Disease have markedly increased susceptibility (including Salmonella osteomyelitis)." },
            { id: 18, text: "Complications of acute haematogenous osteomyelitis include:", options: ["Osteosarcoma", "Brain abscess", "Pathological fracture", "Bone deformity", "Ankylosis of the adjoining joint"], correct: ["B", "C", "D"], exp: "Inadequate treatment of osteomyelitis leads to cortical necrosis, pathologic fractures, physeal arrest deformities, and metastatic septic emboli (e.g. brain abscess)." },
            { id: 19, text: "Acute septic arthritis:", options: ["May be caused by N. gonorrhea", "Gives rise to joint swelling, restricted active movement but presence of passive movement", "Is best diagnosed by aspiration of the joint", "Maybe associated with hyperuricaemia", "On x-ray shows Osteolysis of the bones in the joint"], correct: ["A", "C"], exp: "N. gonorrhoeae is a frequent cause in sexually active young adults. Diagnostic gold standard is joint fluid aspiration for cell count, Gram stain, and culture." },
            { id: 20, text: "A 16-year old boy with intermittent distal tibial pain; X-ray shows a cystic area surrounded by sclerotic bone. The most likely diagnosis is:", options: ["Osteosarcoma", "Non-ossifying fibroma", "Simple bone cyst", "Brodie's abscess", "Osteoid osteoma"], correct: ["D"], exp: "Brodie's abscess is a subacute/chronic localized form of osteomyelitis characterized by a lytic bone lesion surrounded by a thick zone of reactive sclerosis." },
            { id: 21, text: "The treatment is:", options: ["A course of penicillin for 4-6 weeks", "Amputation followed by cytotoxic chemotherapy", "Opening of the swelling and curettage", "Excision of the swelling", "Opening of the swelling and filling it with bone chips"], correct: ["C"], exp: "Management of Brodie's abscess requires surgical evacuation, curettage of the sclerotic cavity, and targeted antibiotic therapy." },
            { id: 22, text: "Chronic osteomyelitis:", options: ["Is caused by E. coli", "Presents with recurrent sinuses preceded by painful tender swelling", "On x-ray characteristically shows periosteal new bone formation", "May lead to squamous cell carcinoma", "Is treated by laying the sinus open"], correct: ["B", "D"], exp: "Chronic osteomyelitis presents with persistent sinus tracts draining sequestrum. Long-standing sinus tracts carry a risk of malignant transformation into Marjolin's ulcer (Squamous Cell Carcinoma)." },
            { id: 23, text: "Tuberculosis of bones and joints:", options: ["Is most common in the hip", "Is most commonly caused by the bovine type of M. tuberculosis", "Is blood-borne usually from the intestinal tract.", "Starts in a focus at the metaphysis", "May cause meningitis or military tuberculosis"], correct: ["E"], exp: "Hematogenous dissemination of Mycobacterium tuberculosis from primary pulmonary foci can produce spinal/skeletal TB, miliary disease, or tubercular meningitis." },
            { id: 24, text: "Clinical features of tuberculous arthritis include:", options: ["Pain in the joint which improves at night when the muscles are relaxed", "Limping and restriction of active but not passive movements", "Swelling of the joint due to synovial effusion and degeneration", "Tenderness of the joint", "Pyrexia at night"], correct: ["C", "D", "E"], exp: "TB arthritis presents insidiously with 'doughy' joint swelling, joint tenderness, night cries/night sweats, and restriction of ALL joint movements (active and passive)." },
            { id: 25, text: "In the investigation of suspected tuberculous arthritis in a 16-year old boy, the following MUST be done:", options: ["IVP", "Culture of early morning gastric washout", "Biopsy (needle or open) of synovial membrane", "Lumbar puncture", "Cystoscopy"], correct: ["C"], exp: "Histopathological confirmation demonstrating caseating granulomas and AFB positivity via synovial tissue biopsy is diagnostic." },
            { id: 26, text: "The general principles in the treatment of joint tuberculosis include:", options: ["Immobilization of the joint in the position of function until the symptoms subside and ESR is normal", "Administration of streptomycin, PAS and INAH for at least 18months", "Provision of protein-rich diet and vitamin D", "Arthrodesis of the affected joint when the disease becomes quiescent", "Examination of all contacts"], correct: ["A", "C", "E"], exp: "Joint TB management relies on prolonged anti-tubercular chemotherapy (ATT), nutritional support, functional splinting, and screening contacts." },
            { id: 27, text: "In tuberculosis of the spine:", options: ["The commonest sites are the lower cervical, upper thoracic and lower lumbar vertebrae", "An abscess from the lumbar spine may present in the iliac fossa, groin, triangle of Petit or gluteal region", "The first radiological sign is destruction of the body of the vertebra", "There may be concomitant lung involvement in about 50% of patients", "The Mantoux and Heaf's tests are weakly positive in most patients"], correct: ["B", "D"], exp: "Lumbar tuberculous cold abscesses track along the psoas sheath to present in the groin/iliac fossa. Concomitant active or healed pulmonary TB is present in ~50%." },
            { id: 28, text: "Tuberculous (Pott's) paraplegia:", options: ["Is not likely to arise during treatment of tuberculosis of the spine", "Is always spastic in type", "May spare the sphincters and sensation", "Requires operation only if bed rest and chemotherapy do not produce some recovery within 3 months", "Has a poor prognosis; only about 40% of patients are able to walk"], correct: ["C"], exp: "In early or mild Pott's paraplegia secondary to epidural abscess compression, posterior column sensation and bowel/bladder sphincters may initially be spared." },
            { id: 29, text: "A woman of 25 with a soft, painless wrist/hand flexor swelling showing crepitus (rice bodies). Most likely diagnosis:", options: ["Rheumatoid arthritis of the wrist", "Tuberculous arthritis of the wrist", "Tuberculous tenosynovitis", "Sprain of the wrist", "Gout"], correct: ["C"], exp: "Compound volar ganglion / Tuberculous tenosynovitis of the flexor sheaths presents with a dumbbell wrist/palmar swelling containing melon-seed 'rice bodies'." },
            { id: 30, text: "The most useful investigation is:", options: ["X-ray of the wrist", "Mantoux test", "White cell counts and differential", "Biopsy", "Serum uric acid"], correct: ["D"], exp: "Histological examination of excised synovial sheath showing caseating granulomatous inflammation confirms tuberculous tenosynovitis." },
            { id: 31, text: "In acute infections of the hand:", options: ["The commonest organisms are Esch. coli and Strep. haemolyticus", "The antibiotics of first choice are penicillin, ampicillin or ox tetracycline", "Suppuration is inevitable", "Pus should be drained as soon as it is formed, the incision being placed over the point of maximum tenderness", "Acute osteomyelitis may be a complication"], correct: ["D", "E"], exp: "Surgical incision and drainage should occur over the point of maximal tenderness once purulence forms to prevent bone invasion/osteomyelitis." },
            { id: 32, text: "Chronic paronychia:", options: ["Is an insidious low grade infection of the nail fold", "Is caused by Staph. aureus", "Is treated with tetracyclines or penicillin for 3-4 weeks", "If unresponsive to conservative treatment will require the removal of the nail", "May cause osteomyelitis of the phalanx"], correct: ["A", "D"], exp: "Chronic paronychia is a chronic peri-ungual inflammatory state (often Candida/mixed flora). Recalcitrant cases require marsupialization or eponychial excision / nail extraction." },
            { id: 33, text: "A carpenter with throbbing palmar pain and dorsal swelling; finger extension does not provoke sheath pain. Diagnosis:", options: ["Cellulitis of the hand", "Septic blister of the palm", "Palmar space infection", "Infection of the ulnar bursa", "Infection of the radial bursa"], correct: ["C"], exp: "Infection of deep palmar spaces (midpalmar or thenar space) presents with severe palmar tenderness and prominent ballooning edema of the loose dorsal hand skin." },
            { id: 34, text: "In osteogenesis imperfecta:", options: ["Collagen formation is normal but osteoid formation is defective", "The sclera of the eye is blue", "Otosclerosis occurs early in adulthood", "The serum calcium and alkaline phosphatase are normal", "Fluoride is of proven value"], correct: ["B", "C"], exp: "Osteogenesis imperfecta (Type 1 collagen defect) features bone fragility, blue sclerae (due to choroidal translucency through thin sclera), and early-onset conductive hearing loss." },
            { id: 35, text: "Achondroplasia:", options: ["Is a deformation", "Is caused by defective growth of the diaphysis", "Is associated with subnormal intelligence", "Gives rise to three divergent mid-fingers of about the same length", "Gives rise to genu varus"], correct: ["D", "E"], exp: "Achondroplasia impairs endochondral ossification of physes, yielding short-limbed dwarfism, trident hands (fingers equal length), bow legs (genu varum), and normal intellect." },
            { id: 36, text: "Features of dyschondroplasia (Ollier's disease)", options: ["Ecchondromata", "Enchondromata", "Limb shortening", "Malignant degeneration", "Sexual precocity"], correct: ["B", "C"], exp: "Ollier's disease is characterized by multiple asymmetric intra-medullary cartilaginous tumors (enchondromas) leading to limb shortening and angular deformities." },
            { id: 37, text: "Diaphyseal aclasis (Multiple Hereditary Exostoses):", options: ["Is familial with a male preponderance", "Affects the growing ends of long and short bones", "Results from defective moulding of the metaphysis leaving islands of bone on the diaphysis", "Continues to grow even after cessation of growth of the skeleton", "May rarely become malignant"], correct: ["A", "C", "E"], exp: "Autosomal dominant condition featuring multiple osteochondromas due to defective metaphyseal remodeling. Growth stops at skeletal maturity; adult growth implies chondrosarcoma transformation." },
            { id: 38, text: "In cleido-cranial dysostosis:", options: ["There is premature fusion of the fontanelles and membrane bones", "The vault of the skull is high and pointed", "The clavicles are either missing or defective in the center or at either end and the shoulders can be made to touch in front", "There may be an extra long index finger and syndactyly", "Operative correction of the defects gives satisfactory results"], correct: ["C"], exp: "Defective intramembranous ossification causes aplasia/hypoplasia of clavicles, allowing hypermobility where shoulders can be approximated anteriorly in the midline." },
            { id: 39, text: "In fibrous dysplasia:", options: ["The affected bones are replaced by fibrous tissue and bend easily", "The metaphysis is the part affected", "Radiolucent areas looking like cysts abound", "If there is associated skin pigmentation with sexual precocity in the male, it is known as Albright's syndrome", "Calcium and calcitonin have been found useful"], correct: ["A", "C"], exp: "Normal bone medullary space is replaced by fibro-osseous tissue with characteristic 'ground-glass' matrix, predisposing to deformities ('shepherd's crook') and pathologic fractures." },
