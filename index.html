            { id: 40, text: "A defect of the upper limb:", options: ["Is usually a malformation", "Is usually due to damage of the limb bud which appears in the 4th intra-uterine week", "If a congenital amputation, then development of the limb stops at any level from the elbow to the wrist", "If the short bones are absent then it is phocomelia", "Is radio-ulnar synostosis if the radius and ulna are joined distally by a bridge of bone which prevents pronation and supination"], correct: ["A"], exp: "Structural upper extremity anomalies arising from primary intrinsic embryonic developmental errors are categorized as congenital malformations." },
            { id: 41, text: "Congenital dislocation of the hip (DDH):", options: ["Is fairly common in Black Africa", "Presents as adducted and flexed hip", "Gives a click when it is reduced", "Can be cured if discovered at birth and retained in a Barlow splint for 3 months", "If resistant to conservative measures should be treated by open reduction at 4 years."], correct: ["C", "D"], exp: "Ortolani test elicits a palpable/audible 'click' or 'clunk' as the dislocated femoral head reduces into the acetabulum. Early dynamic splinting (Pavlik harness / Barlow) yields high cure rates." },
            { id: 42, text: "Talipes equino-varus (Clubfoot):", options: ["Is a defect of the foot in which the foot is plantar-flexed, inverted and adducted", "Is primarily a subluxation of the mid-tarsal joint", "May be a malformation or a deformation", "In a child that is walking, only the outer side of the sole touches the ground", "Is more common in females"], correct: ["A", "B", "C"], exp: "Clubfoot (CTEV) components include Midfoot CAVE: Cavus, Forefoot Adduction, Hindfoot Varus, and Ankle Equinus, caused by talocalcaneonavicular subluxation." },
            { id: 43, text: "In Klippel-Feil syndrome, there:", options: ["Is a high hair line", "Is a very short neck", "Is unilateral Sprengel's shoulder", "May be fusion of vertebrae", "May be kyphosis"], correct: ["B", "D"], exp: "Klippel-Feil triad: Low posterior hairline, short neck, and restricted neck motion due to congenital segmentation failure/fusion of cervical vertebrae." },
            { id: 44, text: "Congenital infantile torticollis:", options: ["Is a deformation from intra-uterine pressure", "Leads to fibrosis of some fibres of the sterno-mastoid muscle", "Causes tilting of the head to the affected side", "Causes rotation of the face to the affected side", "Is managed in the early cases by division of the sterno-mastoid muscle"], correct: ["B", "C"], exp: "Sternocleidomastoid tumor/fibrosis causes ipsilateral lateral head tilt towards the tight muscle and chin rotation towards the opposite contralateral shoulder." },
            { id: 45, text: "In peripheral nerve lesion:", options: ["Axonotmesis is anatomical division of a nerve", "Neurotmesis is a lesion in which the Schwann sheath is intact but the medulla is damaged and undergoes Wallerian degeneration.", "Neuropraxia is a lesion in which there is cessation of transmission of nerve impulses but no detectable anatomical damage", "The rate of nerve growth in neurotmesis is 1mm a day", "Recovery is possible in Axonotmesis only if there is surgical approximation of the divided ends"], correct: ["C"], exp: "Seddon Classification: Neuropraxia is transient conduction block without structural axonal disruption; full recovery occurs spontaneously." },
            { id: 46, text: "In peripheral nerve injuries:", options: ["Extended elbow with pronated forearm and hand is suggestive of injury of the lower trunk of the brachial plexus", "Clawing of all fingers of the hand is suggestive of median nerve injury", "Foot drop is suggestive of medial popliteal nerve injury", "Loss of sensation of the sole of the foot is suggestive of posterior tibial nerve injury", "Analgesia of the dorsum of the thumb, index and middle fingers just beyond the distal interphalangeal joint is suggestive of median nerve injury"], correct: ["D", "E"], exp: "Tibial nerve innervates sole plantar skin. Median nerve supplies palmar/dorsal skin of digits 1-3.5 distal to DIP joints." },
            { id: 47, text: "Erb's palsy:", options: ["Results most commonly from difficult breech delivery", "Affects the biceps and brachialis", "Causes supination of the forearm and extension of the elbow", "Untreated, results in a stiff internally rotated shoulder", "Has a poor prognosis"], correct: ["B", "D", "E"], exp: "Erb-Duchenne paralysis (C5-C6 upper plexus injury) causes 'waiter's tip' posture (shoulder adducted/internally rotated, elbow extended, forearm pronated) with loss of biceps/brachialis." },
            { id: 48, text: "Klumpke's palsy:", options: ["Results from breech delivery", "Affects C8 and T1", "Causes paralysis only of the hand", "Recovers rapidly", "Is treated by passive movements"], correct: ["A", "B"], exp: "Klumpke's palsy (lower plexus C8-T1 disruption) occurs during hyperabduction/breech extraction, producing claw hand due to intrinsic muscle weakness." },
            { id: 49, text: "Anterior poliomyelitis:", options: ["Is an acute inflammation of the cells of the anterior, posterior and lateral horns of the spinal cord and motor cells of the brain stem", "Is caused by an entero-virus of which there are anti-genetically four", "Is endemic with occasional epidemics", "Is now rare", "Affects mostly people over 5 years"], correct: ["C"], exp: "Poliovirus selectively attacks anterior horn motor neurons of the spinal cord, leading to asymmetric flaccid paralysis." },
            { id: 50, text: "In anterior poliomyelitis:", options: ["The virus enters the oro-pharynx only by inhalation of droplets", "Paralytic poliomyelitis probably accounts for about 20% of cases in an epidemic", "Paralysis is related to injury or vigorous activity during the incubation period but not to recovery from a debilitating illness", "Males are more commonly affected", "The incubation is usually 1-2 weeks but may last 5 weeks"], correct: ["E"], exp: "Incubation period of enteroviral poliomyelitis typically ranges between 7 to 14 days (up to 35 days)." },
            { id: 51, text: "Symptoms of anterior poliomyelitis include:", options: ["Diarrhoea", "Photophobia and stiffness of the neck", "Paraesthesia, sore throat and headache", "Muscle pain and tenderness", "Fever, cough and dyspnoea"], correct: ["A", "B", "D"], exp: "Prodromal viral symptoms include gastroenteritis (diarrhea), meningeal signs (nuchal rigidity, photophobia), and localized myalgias/muscle tenderness." },
            { id: 52, text: "Paralysis in anterior poliomyelitis", options: ["Comes on gradually", "Reaches a peak in 2-3 weeks and most recovery is within 6 months of attack", "Is flaccid in type", "Involves in order of increasing intensity, the lower limbs, trunk and upper limb", "Causes incontinence"], correct: ["C"], exp: "Anterior horn cell destruction yields acute lower motor neuron (LMN) flaccid paralysis with loss of deep tendon reflexes." },
            { id: 53, text: "Measures adopted in the treatment of residual paralysis in anterior poliomyelitis include:", options: ["No treatment", "Tenotomy", "Tendon transplantation", "Arthrodesis", "Osteotomy"], correct: ["A", "B", "C", "D", "E"], exp: "Reconstructive procedures for post-polio deformities include tendon transfers, soft-tissue contracture tenotomies, corrective osteotomies, and joint arthrodesis." },
            { id: 54, text: "In anterior poliomyelitis:", options: ["The mortality is about 10%", "About 50% have residual paralysis", "Elimination from a community can be achieved by the immunization of most of the infants", "The Salk vaccine is more effective than the Sabin vaccine in prevention", "The Sabin vaccine is given orally"], correct: ["A", "E"], exp: "Bulbar polio carries high mortality (~10%). Live attenuated Sabin vaccine (OPV) is administered orally." },
            { id: 55, text: "Cerebral palsy may be caused by:", options: ["Rhesus incompatibility", "Sickle cell disease", "Antepartum haemorrhage", "Asphyxia neonatorum", "Encephalitis."], correct: ["A", "C", "D", "E"], exp: "Etiologies of CP include perinatal hypoxia/asphyxia, kernicterus (Rh disease), intrapartum hemorrhage, and infantile encephalitis." },
            { id: 56, text: "In spastic paralysis or paresis:", options: ["The lesion is in the basal ganglia", "The infant has no difficulty in sucking but may have difficulty in holding up the head later", "The hands go involuntarily into flexion at the wrist with adduction of the thumb", "There is ataxia of gait", "There may be choreiform movements and hyperkinesia"], correct: ["C"], exp: "Spastic CP (corticospinal upper motor neuron lesion) features classic flexor hypertonia: wrist flexion, pronation, and thumb-in-palm deformity." },
            { id: 57, text: "Osteochondritis juvenilis:", options: ["Is associated with disturbance of the vascular supply to a segment of bone and its adjoining cartilage", "Affects the metaphysis primarily", "Is caused by hormonal imbalance", "Is best treated by repeated injection of hydrocortisone with xylocaine into the affected joint", "Usually takes 12-18 months to settle"], correct: ["A", "E"], exp: "Aseptic avascular necrosis of epiphyses (osteochondrosis) involves ischemia followed by revascularization and repair over a 1-2 year cycle." },
            { id: 58, text: "Examples of traction epiphyseal or apophyseal type of Osteochondritis juvenilis include:", options: ["Kienboch's disease of the lunate", "Freiberg's disease of the head of the 2nd or 3rd metatarsal", "Osgood-Schlatter's disease of the tibial tuberosity", "Osteochondritis dissecans of the medial femoral condyle", "Perthes' disease"], correct: ["C"], exp: "Osgood-Schlatter disease is repetitive microtrauma traction apophysitis at the insertion of the patellar tendon into the tibial tuberosity." },
            { id: 59, text: "A 7-year old boy with painful right hip and limp for 4 weeks; no fever or constitutional symptoms; limited hip motion. Most likely diagnosis:", options: ["Synovitis", "Tuberculous arthritis of the hip", "Septic arthritis of the hip", "Osteochondritis of the femoral capital epiphysis", "Irritable hip"], correct: ["D"], exp: "Perthes' disease (idiopathic avascular necrosis of femoral capital epiphysis) presents typically in young boys (aged 4-8) with painless or mild antalgic limp and restricted internal rotation/abduction." },
            { id: 60, text: "In Perthes' disease:", options: ["The male/female ratio is 1/4", "Late cases have limitation of abduction and internal rotation", "X-ray may show a small or fragmented opaque capital epiphysis", "Most patients under 6 years do well with or without treatment", "Treatment averts deformity in most patients over 9 years"], correct: ["B", "C", "D"], exp: "Perthes shows male predominance (4:1). Radiographs reveal dense, fragmented epiphysis. Younger patients (<6 yrs) have favorable remodeling potential." },
            { id: 61, text: "Blount's disease (osteochondrosis deformans tibiae)", options: ["Is seen all over the world", "Results from disturbance of growth at the lateral aspect of the upper tibial metaphysis", "Results in genu valgum", "If bilateral, the child may be so deformed as to walk with the pelvis a few inches from the ground", "Is treated by tibial osteotomy"], correct: ["D", "E"], exp: "Blount's disease is growth suppression of posteromedial proximal tibial physis causing progressive genu varum (bow legs); severe cases require proximal tibial valgus osteotomy." },
            { id: 62, text: "Idiopathic slipped upper femoral epiphysis (SUFE):", options: ["Is a gradual downward and anterior displacement of the femoral capital epiphysis in adolescents.", "Causes limitation of external rotation and adduction", "May be associated with hypogonadism", "Is bilateral in about 40% of patients", "Is best treated by reduction"], correct: ["C"], exp: "SUFE occurs in overweight adolescents or those with endocrine disorders (hypogonadism/hypothyroidism). Epiphysis slips posteriorly and inferiorly." },
            { id: 63, text: "Osteoarthritis:", options: ["Is an atrophic degenerative joint disease", "Causes limitation of external rotation and adduction", "Maybe be associated with hypogonadism", "Is bilateral in about 40% of patients", "Is best treated by reduction"], correct: ["E"], exp: "Surgical joint realignment/osteotomy or arthroplasty aims to correct joint congruity in osteoarthritis." },
            { id: 64, text: "Osteoarthritis may be caused by:", options: ["Genu valgum", "Septic arthritis", "Intra-articular cortisone therapy", "Delayed union of a fracture", "AS disease"], correct: ["A", "B", "C"], exp: "Secondary osteoarthritis results from altered joint mechanics (genu valgum), direct cartilage destruction (septic arthritis), or repeated intra-articular steroid-induced chondrotoxicity." },
            { id: 65, text: "In osteoarthritis:", options: ["There is fragmentation of the articular cartilage", "The synovial membrane is thin", "Young blood vessels invade the peripheral articular cartilage", "There is friction on the subchondral bone", "The adjoining bone undergoes osteolysis"], correct: ["A", "C", "D"], exp: "OA pathogenesis involves hyaline cartilage fibrillation/fragmentation, subchondral bone eburnation/friction, and vascular outgrowth forming marginal osteophytes." },
            { id: 66, text: "The characteristic clinical symptoms of osteoarthritis is/are:", options: ["Increasing stiffness", "Pain", "Crepitus", "Deformity", "Swelling"], correct: ["A", "B", "C", "D", "E"], exp: "OA hallmarks: Use-related joint pain, morning/inactivity stiffness, bony enlargement, joint line tenderness, crepitus, and progressive angular deformity." },
            { id: 67, text: "The pain in osteoarthritis:", options: ["Is initially intermittent and later becomes constant", "Occurs on movement", "Is not relieved by rest", "Arises from spasm of local muscle and not from the joint", "Is not referred to another joint"], correct: ["A", "B"], exp: "Osteoarthritic pain is characteristically mechanical—exacerbated by joint loading/movement and relieved by rest initially, becoming constant in advanced stages." },
            { id: 68, text: "In osteoarthritis of the hip, the joint is:", options: ["Abducted", "Internally rotated", "Flexed", "Ankylosed", "Externally rotated"], correct: ["C"], exp: "Advanced hip OA causes progressive fixed flexion, adduction, and external rotation deformity." },
            { id: 69, text: "X-ray of a joint in osteoarthritis shows:", options: ["Broadening of joint space", "Subchondral osteoporosis", "Osteophytes", "Lipping of marginal bone", "Articular cyst formation"], correct: ["C", "D"], exp: "Classic radiographic OA features (LOSS): Asymmetric joint space Loss, Osteophytes (marginal lipping), Subchondral Sclerosis, and Subchondral Cysts." },
            { id: 70, text: "Oral drugs that may be used in osteoarthritis include:", options: ["Acetylsalicylic acid", "Cortisone", "Ketobrufen", "Piroxicam", "Morphine"], correct: ["A", "C", "D"], exp: "Analgesics and Non-Steroidal Anti-Inflammatory Drugs (NSAIDs like aspirin, ketoprofen, piroxicam) reduce osteoarthritic nociceptive pain and synovitis." },
            { id: 71, text: "The following may be adopted in the treatment of osteoarthritis:", options: ["Hot fermentation", "Arthroplasty", "Amputation", "Arthrodesis", "Osteotomy"], correct: ["B", "D", "E"], exp: "Surgical options for end-stage OA: Total joint replacement (arthroplasty), joint fusion (arthrodesis), or realigning realignment osteotomy." },
            { id: 72, text: "Growth hormone:", options: ["Is produced by the basophil cells of the anterior pituitary", "Stimulates protein synthesis and growth", "Enhances glucose uptake by the cells", "If produced excessively before epiphyseal fusion leads to acromegaly", "If deficient in childhood leads to a dwarf with small trunk, small limbs, big head and normal intelligence"], correct: ["B"], exp: "Somatotropin (GH) secreted by anterior pituitary somatotrophs promotes skeletal/somatic growth by enhancing amino acid uptake and protein synthesis." },
            { id: 73, text: "Features of acromegaly include:", options: ["Increased height", "Prominent mandible", "Thickening of face", "Prominent supra-orbital ridge", "Long limbs"], correct: ["B", "C", "D"], exp: "Post-physeal fusion excess GH causes acral/soft tissue overgrowth: Pronounced prognathism (mandible), frontal bossing (supraorbital ridges), and facial coarsening." },
            { id: 74, text: "Bone is affected by:", options: ["Thyroxine", "Testosterone", "Oestrogen", "Cortisol", "Glucagon"], correct: ["A", "B", "C", "D"], exp: "Skeletal metabolism and bone remodeling are modulated by thyroid hormones, sex steroids (estrogen, testosterone), and glucocorticoids (cortisol)." },
            { id: 75, text: "In osteoporosis:", options: ["There is a reduction in bone mass per unit volume", "Osteoid formation is normal", "Calcification of osteoid is deficient", "Post-menopausal women are more commonly affected", "The long bones are more affected than the vertebrae and pelvis"], correct: ["A", "D"], exp: "Osteoporosis is defined as loss of normally mineralized bone mass per unit volume. Post-menopausal estrogen deficiency accelerates trabecular bone loss." },
            { id: 76, text: "Aetiological factors in osteoporosis probably include:", options: ["Increased muscular activity", "Thyrotoxicosis", "Diminished ACTH production", "Inadequate intake of protein and Vit. C", "Diminished progesterone output"], correct: ["B", "D"], exp: "Excess thyroid hormone accelerates bone turnover/resorption. Malnutrition (low protein/vitamin C) impairs osteoid matrix synthesis." },
            { id: 77, text: "In osteoporosis:", options: ["Most patients have severe bone pain", "The patient may present with fracture of the spine, neck of femur, neck of humerus or lower end of the radius", "There is progressive loss of height", "The serum alkaline phosphatase is elevated", "The serum calcium is depressed"], correct: ["B", "C"], exp: "Osteoporosis is silent until fragility fractures occur (distal radius, vertebral compression leading to loss of height, and proximal femur). Serum Ca, P, ALP are normal." },
            { id: 78, text: "SPECIFIC treatment for osteoporosis includes:", options: ["Calcium 3g/day", "Large doses of Vit. C", "Thyroxine", "Bisphosphonates", "Oestrogens"], correct: ["D"], exp: "Bisphosphonates (antiresorptive agents) are first-line pharmacological treatment for osteoporosis to reduce fracture risk." },
            { id: 79, text: "Paget's disease (osteitis deformans):", options: ["Is generalized affection of the skeleton in middle aged and elderly men but not women", "Is characterized by hardening of the bones", "Is caused by deficiency of testosterone", "May cause pathological fractures", "Becomes sarcomatous in about 25% of patients"], correct: ["D"], exp: "Disorganized hyperactive bone remodeling in Paget's leads to weak, enlarged, vascular bones prone to pathologic fractures and malignant transformation (<1% osteosarcoma)." },
            { id: 80, text: "Paget's disease:", options: ["Is asymptomatic in most patients", "Leads to kyphosis and stooping", "Leads to genu valgum", "May result in cardiac failure because of frequently associated valvular affections", "May shorten the height"], correct: ["A", "B", "E"], exp: "Most Paget's cases are asymptomatic (incidental ALP elevation). Progressive bony softening leads to spinal compression (kyphosis), height loss, and bow legs." },
            { id: 81, text: "In Paget's disease:", options: ["The serum alkaline phosphatase is markedly raised", "The serum phosphate is usually low", "The serum calcium is usually normal", "The affected bones on x-ray are dense, often deformed, narrow and contains cyst-like areas", "Calcitonin 50-100 i.u. intravenously daily for several months may arrest the disease"], correct: ["A", "C", "E"], exp: "Marked elevation of serum Alkaline Phosphatase reflects intense osteoblastic activity. Serum calcium/phosphate remain normal." },
            { id: 82, text: "Clinical features in scurvy include:", options: ["Subperiosteal haematoma", "Fever", "Bleeding gums", "Sabre tibia", "Separation of the epiphyses"], correct: ["A", "C"], exp: "Vitamin C deficiency impairs collagen cross-linking, causing capillary fragility: Subperiosteal hematomas, swollen bleeding gums, and petechiae." },
            { id: 83, text: "Rickets:", options: ["Is seen in children and adolescents", "Is in all patients caused by inadequate Vit. D intake", "Results in failure of calcification of osteoid to osseous bone", "Pathologically gives rise to a wide, thick cartilage zone of the epiphyseal growth plate", "Is now rare in the world because of routine administration of Vit. D to children"], correct: ["C", "D"], exp: "Rickets is impaired mineralization of osteoid matrix and growth plate cartilage in children, leading to unmineralized osteoid buildup and widened, disorganized physes." },
            { id: 84, text: "Clinical features in rickets include:", options: ["Diarrhoea and vomiting", "Tetany", "Knock knees but not bow legs", "Thickening and widening of the wrists", "Bossing of the frontal, parietal, costal and phalangeal bones"], correct: ["B", "D"], exp: "Rachitic signs: Hypocalcemic tetany, physeal expansion (widened wrists), rachitic rosary, frontal bossing, and bow legs / knock knees." },
            { id: 85, text: "In rickets:", options: ["The serum alkaline phosphatase is normal", "The serum phosphorous is usually low", "The blood urea may be elevated", "The urine phosphate may be elevated", "The faecal fat may be more than 6g daily"], correct: ["B", "C", "D", "E"], exp: "Secondary hyperparathyroidism in rickets increases renal phosphate excretion (phosphaturia), depressing serum phosphorus levels." },
            { id: 86, text: "In the treatment of rickets:", options: ["Vit.D 1,000 i.u. given daily gives dramatic results", "The serum calcium, phosphate and alkaline phosphatase are checked monthly", "Hypocalcaemia or hypercalcaemia may occur", "Oral calcium 1g should be given daily", "Bony deformities may recover spontaneously"], correct: ["E"], exp: "With nutritional Vitamin D repletion and remineralization, minor rachitic angular bone deformities can remodel spontaneously in young growing children." },
            { id: 87, text: "Osteomalacia:", options: ["Is uncommon and is generally seen in elderly women and rarely in pregnant or lactating women", "May deform the pelvis", "May complicate Billroth I partial gastrectomy", "Is confirmed by biopsy of the iliac crest", "Is treated with Vit. D 2,000 i.u. and calcium 1g daily"], correct: ["A", "B", "D"], exp: "Osteomalacia ('adult rickets') impairs osteoid mineralization, causing pelvic deformities (triradiate pelvis). Non-decalcified iliac crest bone biopsy is gold standard." },
            { id: 88, text: "A 1-year old male child with swollen immobile limbs, restlessness, and bleeding gums. Diagnosis:", options: ["Sickle cell disease", "Acute poliomyelitis", "Scurvy", "Acute osteomyelitis", "Anaemia"], correct: ["C"], exp: "Infantile scurvy (Barlow's disease) presents with pseudoparalysis from painful subperiosteal hematomas, irritability, and hemorrhagic mucosal/gingival lesions." },
            { id: 89, text: "Investigations that will be useful in establishing the diagnosis include:", options: ["Full blood count and sickling", "X-ray of the affected limbs", "Serum ascorbic acid", "Urinary excretion of ascorbic acid after a loading dose", "Blood culture"], correct: ["B", "D"], exp: "Radiographs show subperiosteal elevation/calcification and Frankel's line. Ascorbic acid vitamin loading excretion tests confirm Vitamin C deficiency." },
            { id: 90, text: "Lumbar spinal epidural abscess:", options: ["Is fairly common", "Is a metastatic infection caused by staph. aureus", "Causes localized pain often with radicular radiation", "Causes rapidly developing spastic paraplegia and sphincteric incompetence", "Is evacuated through laminectomy under antibiotic cover"], correct: ["B", "C"], exp: "Metastatic S. aureus hematogenous spinal epidural abscess causes severe midline back pain, radicular shooting pain, and rapid neurological compression." },
            { id: 91, text: "The correct posture when sitting is:", options: ["Feet flat on the ground", "Chest lifted", "Head low", "Shoulder relaxed", "Arm fully pronated"], correct: ["A", "B"], exp: "Ergonomic sitting posture requires feet resting flat on the floor, lumbar spine supported, chest lifted, and shoulders relaxed." },
            { id: 92, text: "Bone changes in sickle cell disease include:", options: ["Enlarged costo-chondral junction", "Expansion of the diploe", "Platyspondyly", "Coxa vara", "Dactylitis"], correct: ["B", "C", "E"], exp: "SCD marrow hyperplasia expands skull diploë ('hair-on-end'). Microvascular infarction causes dactylitis (hand-foot syndrome) and vertebral body flattening (H-shaped vertebrae/platyspondyly)." },
            { id: 93, text: "Osteomyelitis in sickle cell disease is characterized by:", options: ["Asymmetrical involvement of the bones", "Diaphyseal involvement", "Refraction to medical treatment in the early stages", "Multifocal distribution", "Severe septicaemia"], correct: ["B"], exp: "In contrast to classic pediatric osteomyelitis (metaphyseal), sicklers often develop osteomyelitis in the bone diaphysis secondary to bone marrow infarction." },
            { id: 94, text: "In prolapse of lumbar intervertebral disc:", options: ["The annulus fibrosus is degenerated", "The anterior longitudinal ligament is frayed", "The nucleus pulposus herniates into the neural canal following an extension injury", "Sneezing may be a precipitation trauma", "The commonest site is L3-4"], correct: ["A", "D"], exp: "Disc herniation involves nucleus pulposus extruding through tears in a degenerated annulus fibrosus. Intrathecal pressure spikes (coughing/sneezing) trigger acute root compression." },
            { id: 95, text: "A 40-year old man with lumbar pain radiating down right buttock, posterior thigh, calf to foot. Disc level:", options: ["L1-2", "L2-3", "L3-4", "L4-5", "L5-S1"], correct: ["E"], exp: "S1 nerve root radiculopathy (typically caused by L5-S1 disc herniation) characteristically radiates down the posterior thigh, gastrocnemius calf, and plantar foot/sole." },
            { id: 96, text: "In prolapsed lumbar intervertebral disc:", options: ["Paraesthesia, hyper and hyposensitivity in a dermatome area may occur", "Impairment of tendon reflex is unusual", "Sphincteric disturbance is common", "Muscle atrophy may occur", "Lasegue's sign is negative"], correct: ["A"], exp: "Nerve root compression produces sensory dermatomal alterations (numbness, paresthesias, hyperesthesia)." },
            { id: 97, text: "In spondylosis:", options: ["The nucleus pulposus shrinks as a result of progressive decrease in its water content", "There is degeneration of the cartilaginous plates over the vertebral bodies", "The annulus fibrosis remains intact", "Pain is centered in the spine and associated with stiffness and limitation of spinal movements", "X-ray shows narrowing of the intervertebral joints and new bone formation at the periphery"], correct: ["A", "B", "D", "E"], exp: "Spinal spondylosis involves age-related disc desiccation/dehydration, cartilaginous endplate sclerosis, loss of disc height, marginal osteophytosis, and axial spinal stiffness." },
            { id: 98, text: "Ankylosing spondylitis:", options: ["Is uncommon in West Africans and in Caucasians is more common in young adult females", "Is characterized by calcification and subsequent ossifications of the ligaments and capsule of the joints", "Starts in the thoracic intervertebral joints and spreads downwards to the lumbosacral and sacro-iliac joints", "Gives rise to pain and stiffness worse in the morning and after a period of rest", "Leads to extension deformity of the spine and the ESR is markedly raised"], correct: ["B", "D"], exp: "Ankylosing spondylitis (HLA-B27 associated) features enthesitis, capsular/ligamentous ossification ('bamboo spine'), and inflammatory back pain worse in morning/rest." },
            { id: 99, text: "Severe low back pain in a 40-year old woman, which is not relieved by rest in bed, may be due to:", options: ["Faulty posture on standing and sitting", "Complete rupture of an interspinous ligament", "Cervicitis", "Anxiety neurosis", "Vertebral metastatic carcinoma from the breast"], correct: ["C", "D", "E"], exp: "Non-mechanical back pain unaffected by rest or position strongly signals sinister red flag etiology (malignant vertebral metastasis) or pelvic referred visceral pathology." },
            { id: 100, text: "Investigations that must be done in every patient with low back pain are:", options: ["Plain x-ray of thoracic, lumbar and sacral spine", "Tomogram", "Myelogram", "ESR", "Serum alkaline phosphatase"], correct: ["A", "D", "E"], exp: "Baseline initial evaluation for chronic/severe back pain: Plain spinal radiographs, inflammatory markers (ESR), and bone metabolic markers (ALP)." },
            { id: 101, text: "Measures taken in the management of muscular or ligamentous strain of the spine include:", options: ["Rest in bed", "Short wave diathermy and massage", "Wearing of surgical corset", "Operative exploration", "Muscle strengthening exercises"], correct: ["B", "C", "E"], exp: "Conservative lumbar strain management focus: Physical therapy modalities (heat/diathermy), temporary lumbar support corsets, and core muscle strengthening." },
            { id: 102, text: "Cancellous osteoma:", options: ["Is a true tumour", "Is found commonly at the end of long bones", "Continues to grow throughout life", "May undergo malignant change", "Is usually symptomless"], correct: ["B", "E"], exp: "Exostoses/cancellous osteomas occur near juxta-epiphyseal ends of long bones and are benign, usually asymptomatic lesions." },
            { id: 103, text: "Compact (ivory) osteoma:", options: ["Arises in any bone", "Is sessile and slow-growing", "Is painful", "Is covered by a cap of cartilage", "May cause epilepsy if it involves the inner table of the skull"], correct: ["B", "E"], exp: "Ivory osteomas are dense benign skull/facial bone lesions. Intracranial extension from the inner skull table can exert focal mass effect, causing seizures." },
            { id: 104, text: "Osteochondroma:", options: ["Is mushroom in shape, pedunculated or sessile", "Has a growing cap of cartilage", "Is most probably malignant if it continues to grow after skeletal maturity", "Changes to osteo-chondrosarcoma in about 25% of patients", "Should be left alone if it is near the trunk, e.g. scapula or pelvis, as it is not likely to become malignant"], correct: ["A", "B", "C"], exp: "Osteochondromas are cartilage-capped bony exostoses. Persistent growth or cartilage cap thickening (>1.5 cm) after skeletal maturity suggests malignant transformation." },
            { id: 105, text: "Osteoclastoma (Giant Cell Tumor of Bone):", options: ["Arises at the junction of the epiphysis and the metaphysis and spreads to the epiphysis", "Normally penetrates into the joint", "Is a spindle-cell tumour with giant cells formed by coalescence of some of the spindle cells", "Is benign in 50% and frankly malignant in 15% of cases, and the rest though benign recur after removal", "Affects the 10-20 age group"], correct: ["A", "C", "D"], exp: "Giant cell tumor arises in epiphyseal-metaphyseal regions of mature bones (skeletally mature adults 20-40). Characterized by multinucleated giant cells; high local recurrence." },
            { id: 106, text: "The common sites of osteoclastoma include the:", options: ["Scapula", "Lower end of the femur", "Lower end of the tibia", "Pelvis", "Lower end of the radius"], correct: ["B"], exp: "The most common anatomical location for Giant Cell Tumor is the knee region (distal femur and proximal tibia)." },
            { id: 107, text: "Treatment of osteoclastoma may be by:", options: ["Amputation", "Excision", "Curettage and bone graft", "Radiotherapy", "Cytotoxic therapy"], correct: ["A", "B", "C", "D"], exp: "Surgical options range from intralesional curettage with bone grafting/cementation to wide en-bloc resection or amputation for aggressive/recurrent lesions." },
            { id: 108, text: "Enchondroma:", options: ["Is a true tumour arising usually in the metaphysis or shaft of the short long bones of the hand or feet", "Is usually seen in children", "May produce a pathological fracture", "Shows on x-ray as a sclerotic zone within the bone with cortical ballooning", "Is treated by excision"], correct: ["C"], exp: "Enchondromas are benign intramedullary hyaline cartilage tumors of tubular hand/foot bones, often presenting acutely following pathologic fracture." },
            { id: 109, text: "Benign chondroblastoma:", options: ["Is seen in adolescents under 20yrs", "Is more common in females", "Histologically consists of young cartilage cells with areas of giant cell transformation, myxoid and collagenous cells", "Starts in the epiphysis", "May rarely recur after excision or curettage and show malignant characteristics"], correct: ["A", "C", "D", "E"], exp: "Chondroblastoma is a rare benign epiphyseal cartilaginous tumor occurring in skeletally immature adolescents (<20 yrs)." },
            { id: 110, text: "Bone 'swellings' originating from osteoblast include:", options: ["Fibrous osteoma", "Ossifying fibroma", "Osteochondroma", "Aneurysmal bone cyst", "Osteoclastoma"], correct: ["A", "C", "E"], exp: "Osteoblast-lineage derivative skeletal proliferations include osteomas, osteoid osteoma/osteoblastoma variants." },
            { id: 111, text: "A simple bone cyst (Unicameral Bone Cyst):", options: ["Is common in children but rare in adults", "May involve any bone", "Arises in the epiphysis", "Is usually symptomless", "Is treated by excision"], correct: ["A", "B", "D"], exp: "UBCs are fluid-filled metaphyseal lesions in growing children (proximal humerus/femur), usually asymptomatic until presenting with pathological fracture." },
            { id: 112, text: "A solitary radiolucent lesion in the metaphysis of the femur in a boy 15 may be:", options: ["Non-ossifying fibroma", "Chondroma", "Osteoclastoma", "Solitary bone cyst", "Benign chondroblastoma"], correct: ["A", "B", "D", "E"], exp: "Differential diagnosis for pediatric metaphyseal lytic lesions: Non-ossifying fibroma (NOF), solitary bone cyst, enchondroma, or extension of chondroblastoma." },
            { id: 113, text: "Osteosarcoma:", options: ["Is the commonest bone tumour", "Is usually metaphyseal in origin", "Contains elements of bone and cartilage but not of fibrous tissue", "Arises from primitive spindle cells", "Does not arise from extra-osseous tissue"], correct: ["B", "D"], exp: "Osteosarcoma is a primary malignant spindle cell neoplasm originating in long bone metaphyses, characterized by production of malignant osteoid matrix." },
            { id: 114, text: "Osteosarcoma may arise from:", options: ["Cancellous osteoma", "Enchondroma", "Osteochondroma", "Osteitis deformans", "Ossifying fibroma"], correct: ["C", "D"], exp: "Secondary osteosarcoma can arise in Paget's disease of bone (osteitis deformans) or via malignant transformation of an osteochondroma." },
            { id: 115, text: "Osteosarcoma spreads mainly to the:", options: ["Lymph nodes", "Liver", "Lungs", "Brain", "Other bones"], correct: ["C"], exp: "Osteosarcoma metastasizes predominantly hematogenously, with the lungs being the primary and most frequent early site of metastasis." },
            { id: 116, text: "Osteosarcoma:", options: ["Has a peak incidence in the first decade", "Occurs around the knee in 50% of patients", "Has a male/female ratio of 1.5/1", "Does not present with pathological fracture", "Presents with a painful, tender, warm swelling"], correct: ["C", "E"], exp: "Osteosarcoma shows slight male predominance and presents with a rapidly expanding, painful, warm, vascular soft tissue mass." },

            { id: 149, text: "Club foot deformities have the following components:", options: ["Forefoot pronation", "Forefoot supination", "Ankle equinus", "Hind-foot varus", "Mid-foot recurvatum"], correct: ["B", "C", "D"], exp: "Congenital Talipes Equinovarus (CTEV) structural deformity features forefoot supination/adduction, hindfoot varus, and ankle equinus." },
            { id: 150, text: "Hallux valgus:", options: ["Is common amongst elderly men", "Has a genetic predisposition", "Can occur in adolescent girls", "Is bilateral in 50% of cases", "Is always treated by surgery"], correct: ["B", "C", "D"], exp: "Hallux valgus (lateral deviation of great toe) has strong female/hereditary predisposition, frequently affects adolescent girls, and is bilateral in ~50% of cases." }
        ];

        // Global State Manager
        const state = {
            currentChapter: 53, // 53 or 54
            currentIndex: 0,
            filter: 'all', // all, unanswered, correct, incorrect
            searchQuery: '',
            userAnswers: {
                53: {}, // { qId: { selected: ['A', 'B'], checked: true, isCorrect: true } }
                54: {}
            },
            darkMode: false
        };

        // DOM Element Caches
        const elements = {
            chap53Btn: document.getElementById('chap53Btn'),
            chap54Btn: document.getElementById('chap54Btn'),
            questionGrid: document.getElementById('questionGrid'),
            mcqContainer: document.getElementById('mcqContainer'),
            statAnswered: document.getElementById('statAnswered'),
            statCorrect: document.getElementById('statCorrect'),
            statIncorrect: document.getElementById('statIncorrect'),
            scorePercentBadge: document.getElementById('scorePercentBadge'),
            scoreProgressBar: document.getElementById('scoreProgressBar'),
            searchInput: document.getElementById('searchInput'),
            gridCountDisplay: document.getElementById('gridCountDisplay'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            themeIcon: document.getElementById('themeIcon'),
            resetAppBtn: document.getElementById('resetAppBtn')
        };

        // Local Storage Utilities
        function loadState() {
            const saved = localStorage.getItem('ortho_mcq_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.userAnswers = parsed.userAnswers || state.userAnswers;
                    state.currentChapter = parsed.currentChapter || 53;
                    state.darkMode = parsed.darkMode || false;
                } catch(e) {
                    console.error("Failed loading state", e);
                }
            }
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function saveState() {
            localStorage.setItem('ortho_mcq_state', JSON.stringify({
                userAnswers: state.userAnswers,
                currentChapter: state.currentChapter,
                darkMode: state.darkMode
            }));
        }

        function getCurrentDataSet() {
            return state.currentChapter === 53 ? RAW_DATA_CH53 : RAW_DATA_CH54;
        }

        function getFilteredQuestions() {
            const dataset = getCurrentDataSet();
            const answers = state.userAnswers[state.currentChapter] || {};

            return dataset.filter((q, idx) => {
                const qAns = answers[q.id];
                
                // Filter by Status
                if (state.filter === 'unanswered' && qAns && qAns.checked) return false;
                if (state.filter === 'correct' && (!qAns || !qAns.checked || !qAns.isCorrect)) return false;
                if (state.filter === 'incorrect' && (!qAns || !qAns.checked || qAns.isCorrect)) return false;

                // Filter by Search Query
                if (state.searchQuery) {
                    const query = state.searchQuery.toLowerCase();
                    const qNum = (idx + 1).toString();
                    const textMatch = q.text.toLowerCase().includes(query);
                    const numMatch = qNum === query || (`q${qNum}` === query);
                    const optMatch = q.options.some(o => o.toLowerCase().includes(query));
                    return textMatch || numMatch || optMatch;
                }

                return true;
            });
        }

        // Initialize UI & Bind Events
        function initApp() {
            loadState();
            setupEventListeners();
            switchChapter(state.currentChapter, false);
            lucide.createIcons();
        }

        function setupEventListeners() {
            // Theme toggle
            elements.themeToggleBtn.addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                document.documentElement.classList.toggle('dark', state.darkMode);
                saveState();
            });

            // Reset App
            elements.resetAppBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to reset all recorded progress for both chapters?')) {
                    state.userAnswers = { 53: {}, 54: {} };
                    saveState();
                    renderAll();
                }
            });

            // Chapter Tabs
            elements.chap53Btn.addEventListener('click', () => switchChapter(53));
            elements.chap54Btn.addEventListener('click', () => switchChapter(54));

            // Search
            elements.searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.trim();
                renderMatrix();
            });

            // Filter Buttons
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-pill').forEach(b => {
                        b.classList.remove('bg-brand-600', 'text-white');
                        b.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                    });
                    e.target.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                    e.target.classList.add('bg-brand-600', 'text-white');

                    state.filter = e.target.dataset.filter;
                    renderMatrix();
                });
            });
        }

        function switchChapter(chapNum, resetIndex = true) {
            state.currentChapter = chapNum;
            if (resetIndex) state.currentIndex = 0;

            // Update Tab UI
            if (chapNum === 53) {
                elements.chap53Btn.className = "chap-tab-btn py-2 px-3 text-xs font-bold rounded-lg shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400";
                elements.chap54Btn.className = "chap-tab-btn py-2 px-3 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            } else {
                elements.chap54Btn.className = "chap-tab-btn py-2 px-3 text-xs font-bold rounded-lg shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400";
                elements.chap53Btn.className = "chap-tab-btn py-2 px-3 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            }

            saveState();
            renderAll();
        }

        function renderAll() {
            updateStats();
            renderMatrix();
            renderQuestion();
        }

        function updateStats() {
            const dataset = getCurrentDataSet();
            const answers = state.userAnswers[state.currentChapter] || {};
            const total = dataset.length;
            let answeredCount = 0;
            let correctCount = 0;

            dataset.forEach(q => {
                const ans = answers[q.id];
                if (ans && ans.checked) {
                    answeredCount++;
                    if (ans.isCorrect) correctCount++;
                }
            });

            const incorrectCount = answeredCount - correctCount;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            elements.statAnswered.textContent = `${answeredCount}/${total}`;
            elements.statCorrect.textContent = correctCount;
            elements.statIncorrect.textContent = incorrectCount;
            elements.scorePercentBadge.textContent = `${percentage}%`;
            elements.scoreProgressBar.style.width = `${percentage}%`;
        }

        function renderMatrix() {
            const dataset = getCurrentDataSet();
            const filtered = getFilteredQuestions();
            const answers = state.userAnswers[state.currentChapter] || {};

            elements.gridCountDisplay.textContent = `${filtered.length} of ${dataset.length}`;
            elements.questionGrid.innerHTML = '';

            dataset.forEach((q, idx) => {
                const isFilteredIn = filtered.some(fq => fq.id === q.id);
                if (!isFilteredIn) return;

                const ans = answers[q.id];
                const btn = document.createElement('button');
                btn.textContent = idx + 1;

                let classNames = "h-9 text-xs font-semibold rounded-lg border transition flex items-center justify-center ";
                
                if (idx === state.currentIndex) {
                    classNames += "ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800 ";
                }

                if (ans && ans.checked) {
                    if (ans.isCorrect) {
                        classNames += "bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600";
                    } else {
                        classNames += "bg-rose-500 text-white border-rose-600 hover:bg-rose-600";
                    }
                } else {
                    classNames += "bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600";
                }

                btn.className = classNames;
                btn.addEventListener('click', () => {
                    state.currentIndex = idx;
                    renderAll();
                });

                elements.questionGrid.appendChild(btn);
            });
        }

        function renderQuestion() {
            const dataset = getCurrentDataSet();
            if (state.currentIndex >= dataset.length) state.currentIndex = 0;
            const q = dataset[state.currentIndex];
            const qAns = (state.userAnswers[state.currentChapter] || {})[q.id] || { selected: [], checked: false };
            const isMulti = q.correct.length > 1;

            const letterMap = ['A', 'B', 'C', 'D', 'E'];

            let html = `
                <div>
                    <!-- Top Badge Meta Bar -->
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-700">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-100 text-brand-700 dark:bg-brand-950 dark:text-brand-300">
                                Chapter ${state.currentChapter}
                            </span>
                            <span class="text-xs font-semibold text-slate-400">
                                Question ${state.currentIndex + 1} of ${dataset.length}
                            </span>
                        </div>
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-lg ${isMulti ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300' : 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300'}">
                            ${isMulti ? `<i data-lucide="check-square" class="inline w-3 h-3 mr-1"></i> Multiple Answers (${q.correct.length})` : `<i data-lucide="circle-dot" class="inline w-3 h-3 mr-1"></i> Single Choice`}
                        </span>
                    </div>

                    <!-- Question Prompt text -->
                    <h2 class="text-base sm:text-lg font-semibold text-slate-900 dark:text-slate-100 leading-relaxed mb-6">
                        ${q.text}
                    </h2>

                    <!-- Options List -->
                    <div class="space-y-3 mb-6">
            `;

            q.options.forEach((optText, oIdx) => {
                const letter = letterMap[oIdx];
                const isSelected = qAns.selected.includes(letter);
                const isCorrectOption = q.correct.includes(letter);

                let optionClass = "w-full text-left p-3.5 sm:p-4 rounded-xl border text-sm flex items-start gap-3 transition cursor-pointer ";
                let inputType = isMulti ? "checkbox" : "radio";
                
                if (qAns.checked) {
                    if (isCorrectOption) {
                        optionClass += "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-950 dark:text-emerald-200 font-medium";
                    } else if (isSelected && !isCorrectOption) {
                        optionClass += "bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-950 dark:text-rose-200";
                    } else {
                        optionClass += "bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700 opacity-60";
                    }
                } else {
                    if (isSelected) {
                        optionClass += "bg-brand-50 dark:bg-brand-950/40 border-brand-500 text-brand-900 dark:text-brand-100 font-medium shadow-sm";
                    } else {
                        optionClass += "bg-slate-50/60 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50";
                    }
                }

                html += `
                    <div class="${optionClass}" onclick="toggleOption('${letter}', ${isMulti}, ${qAns.checked})">
                        <div class="mt-0.5">
                            <input type="${inputType}" name="mcqOption" ${isSelected ? 'checked' : ''} ${qAns.checked ? 'disabled' : ''} class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                        </div>
                        <div class="flex-1">
                            <span class="font-bold mr-1">${letter}.</span> ${optText}
                        </div>
                        ${qAns.checked && isCorrectOption ? `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600 dark:text-emerald-400 shrink-0"></i>` : ''}
                        ${qAns.checked && isSelected && !isCorrectOption ? `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600 dark:text-rose-400 shrink-0"></i>` : ''}
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- Action Bar (Submit / Reset Option) -->
                    <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                        <div>
                            ${!qAns.checked ? `
                                <button onclick="checkAnswer(${q.id})" ${qAns.selected.length === 0 ? 'disabled class="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-400 rounded-xl font-bold text-xs cursor-not-allowed"' : 'class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-1.5"'}>
                                    <i data-lucide="check-square" class="w-4 h-4"></i> Check Answer
                                </button>
                            ` : `
                                <button onclick="clearSingleAnswer(${q.id})" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white border border-slate-300 dark:border-slate-600 rounded-xl transition flex items-center gap-1">
                                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Re-try Question
                                </button>
                            `}
                        </div>

                        <!-- Previous / Next Pagination -->
                        <div class="flex items-center gap-2">
                            <button onclick="navigatePrev()" ${state.currentIndex === 0 ? 'disabled' : ''} class="px-3.5 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 transition flex items-center gap-1">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i> Prev
                            </button>
                            <button onclick="navigateNext()" ${state.currentIndex === dataset.length - 1 ? 'disabled' : ''} class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-white disabled:opacity-40 transition flex items-center gap-1">
                                Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            <!-- Detailed Explanation Card Section -->
            if (qAns.checked) {
                html += `
                    <div class="mt-6 p-5 rounded-2xl bg-amber-50/70 dark:bg-slate-900/80 border border-amber-200/60 dark:border-slate-700/60 animate-fadeIn">
                        <div class="flex items-center gap-2 mb-2 text-amber-800 dark:text-amber-400 font-bold text-sm">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                            <span>Clinical Explanation & Principles</span>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                            ${q.exp}
                        </p>
                        <div class="mt-3 text-xs font-semibold text-slate-500">
                            Correct Answer(s): <span class="text-emerald-600 dark:text-emerald-400 font-bold">${q.correct.join(', ')}</span>
                        </div>
                    </div>
                `;
            }

            elements.mcqContainer.innerHTML = html;
            lucide.createIcons();
        }

        // Global Action Functions bound to window
        window.toggleOption = function(letter, isMulti, isChecked) {
            if (isChecked) return; // Locked after submitting

            const dataset = getCurrentDataSet();
            const q = dataset[state.currentIndex];
            if (!state.userAnswers[state.currentChapter]) {
                state.userAnswers[state.currentChapter] = {};
            }

            let qAns = state.userAnswers[state.currentChapter][q.id] || { selected: [], checked: false };

            if (isMulti) {
                if (qAns.selected.includes(letter)) {
                    qAns.selected = qAns.selected.filter(l => l !== letter);
                } else {
                    qAns.selected.push(letter);
                }
            } else {
                qAns.selected = [letter];
            }

            state.userAnswers[state.currentChapter][q.id] = qAns;
            saveState();
            renderQuestion();
        };

        window.checkAnswer = function(qId) {
            const dataset = getCurrentDataSet();
            const q = dataset.find(item => item.id === qId);
            const qAns = state.userAnswers[state.currentChapter][qId];

            if (!qAns || qAns.selected.length === 0) return;

            // Sort arrays for comparison
            const selectedSorted = [...qAns.selected].sort();
            const correctSorted = [...q.correct].sort();

            const isCorrect = selectedSorted.length === correctSorted.length && 
                              selectedSorted.every((val, index) => val === correctSorted[index]);

            qAns.checked = true;
            qAns.isCorrect = isCorrect;

            state.userAnswers[state.currentChapter][qId] = qAns;
            saveState();
            renderAll();
        };

        window.clearSingleAnswer = function(qId) {
            if (state.userAnswers[state.currentChapter][qId]) {
                delete state.userAnswers[state.currentChapter][qId];
                saveState();
                renderAll();
            }
        };

        window.navigateNext = function() {
            const dataset = getCurrentDataSet();
            if (state.currentIndex < dataset.length - 1) {
                state.currentIndex++;
                renderAll();
            }
        };

        window.navigatePrev = function() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderAll();
            }
        };

        // Keyboard Shortcut Navigation Support
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight') {
                navigateNext();
            } else if (e.key === 'ArrowLeft') {
                navigatePrev();
            }
        });

        // App Launch Trigger
        window.onload = initApp;
    </script>
</body>
</html>
