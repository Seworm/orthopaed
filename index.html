            { id: 49, text: "Anterior poliomyelitis:", options: ["Is an acute inflammation of the cells of the anterior, posterior and lateral horns of the spinal cord and motor cells of the brain stem", "Is caused by an entero-virus of which there are anti-genetically four", "Is endemic with occasional epidemics", "Is now rare", "Affects mostly people over 5 years"], correct: ["C"], exp: "Poliovirus selectively destroys anterior horn motor neurons of the spinal cord, causing asymmetric LMN flaccid paralysis." },
            { id: 50, text: "In anterior poliomyelitis:", options: ["The virus enters the oro-pharynx only by inhalation of droplets", "Paralytic poliomyelitis probably accounts for about 20% of cases in an epidemic", "Paralysis is related to injury or vigorous activity during the incubation period but not to recovery from a debilitating illness", "Males are more commonly affected", "The incubation is usually 1-2 weeks but may last 5 weeks"], correct: ["E"], exp: "Incubation period of enteroviral poliomyelitis ranges from 7 to 14 days (up to 35 days)." },
            { id: 51, text: "Symptoms of anterior poliomyelitis include:", options: ["Diarrhoea", "Photophobia and stiffness of the neck", "Paraesthesia, sore throat and headache", "Muscle pain and tenderness", "Fever, cough and dyspnoea"], correct: ["A", "B", "D"], exp: "Poliomyelitis prodrome includes gastroenteritis (diarrhoea), meningism (nuchal rigidity, photophobia), and localized muscle pain." },
            { id: 52, text: "Paralysis in anterior poliomyelitis", options: ["Comes on gradually", "Reaches a peak in 2-3 weeks and most recovery is within 6 months of attack", "Is flaccid in type", "Involves in order of increasing intensity, the lower limbs, trunk and upper limb", "Causes incontinence"], correct: ["C"], exp: "Anterior horn cell necrosis produces acute lower motor neuron (LMN) flaccid paralysis." },
            { id: 53, text: "Measures adopted in the treatment of residual paralysis in anterior poliomyelitis include:", options: ["No treatment", "Tenotomy", "Tendon transplantation", "Arthrodesis", "Osteotomy"], correct: ["A", "B", "C", "D", "E"], exp: "Post-polio reconstructive options: Tendon transfers, tenotomies for contracture release, osteotomies, and joint arthrodesis." },
            { id: 54, text: "In anterior poliomyelitis:", options: ["The mortality is about 10%", "About 50% have residual paralysis", "Elimination from a community can be achieved by the immunization of most of the infants", "The Salk vaccine is more effective than the Sabin vaccine in prevention", "The Sabin vaccine is given orally"], correct: ["A", "E"], exp: "Bulbar polio carries ~10% mortality. Live attenuated Sabin vaccine (OPV) is administered orally." },
            { id: 55, text: "Cerebral palsy may be caused by:", options: ["Rhesus incompatibility", "Sickle cell disease", "Antepartum haemorrhage", "Asphyxia neonatorum", "Encephalitis."], correct: ["A", "C", "D", "E"], exp: "Etiologies of CP include perinatal hypoxia, kernicterus (Rh disease), intrapartum hemorrhage, and infantile encephalitis." },
            { id: 56, text: "In spastic paralysis or paresis:", options: ["The lesion is in the basal ganglia", "The infant has no difficulty in sucking but may have difficulty in holding up the head later", "The hands go involuntarily into flexion at the wrist with adduction of the thumb", "There is ataxia of gait", "There may be choreiform movements and hyperkinesia"], correct: ["C"], exp: "Spastic CP (corticospinal upper motor neuron lesion) presents with flexor hypertonia: wrist flexion and thumb-in-palm deformity." },
            { id: 57, text: "Osteochondritis juvenilis:", options: ["Is associated with disturbance of the vascular supply to a segment of bone and its adjoining cartilage", "Affects the metaphysis primarily", "Is caused by hormonal imbalance", "Is best treated by repeated injection of hydrocortisone with xylocaine into the affected joint", "Usually takes 12-18 months to settle"], correct: ["A", "E"], exp: "Aseptic avascular necrosis of epiphyses involves ischemia followed by revascularization and repair over a 12-18 month period." },
            { id: 58, text: "Examples of traction epiphyseal or apophyseal type of Osteochondritis juvenilis include:", options: ["Kienboch's disease of the lunate", "Freiberg's disease of the head of the 2nd or 3rd metatarsal", "Osgood-Schlatter's disease of the tibial tuberosity", "Osteochondritis dissecans of the medial femoral condyle", "Perthes' disease"], correct: ["C"], exp: "Osgood-Schlatter disease is traction apophysitis of the tibial tuberosity at the patellar tendon insertion." },
            { id: 59, text: "A 7-year old boy presents with a painful right hip and limp of 4 weeks duration. Diagnosis:", options: ["Synovitis", "Tuberculous arthritis of the hip", "Septic arthritis of the hip", "Osteochondritis of the femoral capital epiphysis", "Irritable hip"], correct: ["D"], exp: "Perthes' disease (idiopathic AVN of femoral capital epiphysis) presents in young boys (aged 4-8) with mild antalgic limp and restricted internal rotation." },
            { id: 60, text: "In Perthes' disease:", options: ["The male/female ratio is 1/4", "Late cases have limitation of abduction and internal rotation", "X-ray may show a small or fragmented opaque capital epiphysis", "Most patients under 6 years do well with or without treatment", "Treatment averts deformity in most patients over 9 years"], correct: ["B", "C", "D"], exp: "Perthes shows male predominance (4:1). Radiographs reveal dense fragmented capital epiphysis. Younger patients (<6 yrs) have favorable remodeling." },
            { id: 61, text: "Blount's disease (osteochondrosis deformans tibiae)", options: ["Is seen all over the world", "Results from disturbance of growth at the lateral aspect of the upper tibial metaphysis", "Results in genu valgum", "If bilateral, the child may be so deformed as to walk with the pelvis a few inches from the ground", "Is treated by tibial osteotomy"], correct: ["D", "E"], exp: "Blount's disease is growth suppression of posteromedial proximal tibial physis causing severe genu varum; treated with valgus tibial osteotomy." },
            { id: 62, text: "Idiopathic slipped upper femoral epiphysis (SUFE):", options: ["Is a gradual downward and anterior displacement of the femoral capital epiphysis in adolescents.", "Causes limitation of external rotation and adduction", "May be associated with hypogonadism", "Is bilateral in about 40% of patients", "Is best treated by reduction"], correct: ["C"], exp: "SUFE occurs in overweight or endocrine-affected adolescents (hypogonadism/hypothyroidism). Epiphysis slips posteriorly and inferiorly." },
            { id: 63, text: "Osteoarthritis:", options: ["Is an atrophic degenerative joint disease", "Causes limitation of external rotation and adduction", "Maybe be associated with hypogonadism", "Is bilateral in about 40% of patients", "Is best treated by reduction"], correct: ["E"], exp: "Surgical joint realignment osteotomy or reduction aims to correct joint congruity in osteoarthritis." },
            { id: 64, text: "Osteoarthritis may be caused by:", options: ["Genu valgum", "Septic arthritis", "Intra-articular cortisone therapy", "Delayed union of a fracture", "AS disease"], correct: ["A", "B", "C"], exp: "Secondary OA is caused by altered joint mechanics (genu valgum), direct cartilage damage (septic arthritis), or repeated intra-articular steroid Chondrotoxicity." },
            { id: 65, text: "In osteoarthritis:", options: ["There is fragmentation of the articular cartilage", "The synovial membrane is thin", "Young blood vessels invade the peripheral articular cartilage", "There is friction on the subchondral bone", "The adjoining bone undergoes osteolysis"], correct: ["A", "C", "D"], exp: "OA pathogenesis involves articular cartilage fragmentation, subchondral bone eburnation/friction, and vascular outgrowth forming marginal osteophytes." },
            { id: 66, text: "The characteristic clinical symptoms of osteoarthritis is/are:", options: ["Increasing stiffness", "Pain", "Crepitus", "Deformity", "Swelling"], correct: ["A", "B", "C", "D", "E"], exp: "OA hallmarks: Use-related joint pain, morning stiffness, joint line tenderness, crepitus, and angular deformity." },
            { id: 67, text: "The pain in osteoarthritis:", options: ["Is initially intermittent and later becomes constant", "Occurs on movement", "Is not relieved by rest", "Arises from spasm of local muscle and not from the joint", "Is not referred to another joint"], correct: ["A", "B"], exp: "OA pain is characteristically mechanical—exacerbated by joint loading/movement and relieved by rest initially." },
            { id: 68, text: "In osteoarthritis of the hip, the joint is:", options: ["Abducted", "Internally rotated", "Flexed", "Ankylosed", "Externally rotated"], correct: ["C"], exp: "Advanced hip OA causes progressive fixed flexion, adduction, and external rotation deformity." },
            { id: 69, text: "X-ray of a joint in osteoarthritis shows:", options: ["Broadening of joint space", "Subchondral osteoporosis", "Osteophytes", "Lipping of marginal bone", "Articular cyst formation"], correct: ["C", "D"], exp: "Classic radiographic OA features: Asymmetric joint space loss, marginal osteophytes (lipping), subchondral sclerosis, and subchondral cysts." },
            { id: 70, text: "Oral drugs that may be used in osteoarthritis include:", options: ["Acetylsalicylic acid", "Cortisone", "Ketobrufen", "Piroxicam", "Morphine"], correct: ["A", "C", "D"], exp: "NSAIDs (aspirin, ketoprofen, piroxicam) reduce osteoarthritic nociceptive pain and synovitis." },
            { id: 71, text: "The following may be adopted in the treatment of osteoarthritis:", options: ["Hot fermentation", "Arthroplasty", "Amputation", "Arthrodesis", "Osteotomy"], correct: ["B", "D", "E"], exp: "Surgical options for end-stage OA: Total joint arthroplasty, joint arthrodesis, or realigning osteotomy." },
            { id: 72, text: "Growth hormone:", options: ["Is produced by the basophil cells of the anterior pituitary", "Stimulates protein synthesis and growth", "Enhances glucose uptake by the cells", "If produced excessively before epiphyseal fusion leads to acromegaly", "If deficient in childhood leads to a dwarf with small trunk, small limbs, big head and normal intelligence"], correct: ["B"], exp: "Somatotropin (GH) promotes skeletal and somatic growth by enhancing amino acid uptake and protein synthesis." },
            { id: 73, text: "Features of acromegaly include:", options: ["Increased height", "Prominent mandible", "Thickening of face", "Prominent supra-orbital ridge", "Long limbs"], correct: ["B", "C", "D"], exp: "Post-physeal excess GH causes prognathism (prominent mandible), frontal bossing (supra-orbital ridges), and facial soft-tissue thickening." },
            { id: 74, text: "Bone is affected by:", options: ["Thyroxine", "Testosterone", "Oestrogen", "Cortisol", "Glucagon"], correct: ["A", "B", "C", "D"], exp: "Skeletal metabolism and bone remodeling are modulated by thyroid hormone, sex steroids (estrogen, testosterone), and glucocorticoids (cortisol)." },
            { id: 75, text: "In osteoporosis:", options: ["There is a reduction in bone mass per unit volume", "Osteoid formation is normal", "Calcification of osteoid is deficient", "Post-menopausal women are more commonly affected", "The long bones are more affected than the vertebrae and pelvis"], correct: ["A", "D"], exp: "Osteoporosis is defined as loss of normally mineralized bone mass per unit volume. Estrogen deficiency accelerates post-menopausal trabecular bone loss." },
            { id: 76, text: "Aetiological factors in osteoporosis probably include:", options: ["Increased muscular activity", "Thyrotoxicosis", "Diminished ACTH production", "Inadequate intake of protein and Vit. C", "Diminished progesterone output"], correct: ["B", "D"], exp: "Excess thyroid hormone accelerates bone turnover/resorption. Malnutrition (low protein/vitamin C) impairs osteoid matrix synthesis." },
            { id: 77, text: "In osteoporosis:", options: ["Most patients have severe bone pain", "The patient may present with fracture of the spine, neck of femur, neck of humerus or lower end of the radius", "There is progressive loss of height", "The serum alkaline phosphatase is elevated", "The serum calcium is depressed"], correct: ["B", "C"], exp: "Osteoporosis is silent until fragility fractures occur (distal radius, vertebral compression height loss, proximal femur)." },
            { id: 78, text: "SPECIFIC treatment for osteoporosis includes:", options: ["Calcium 3g/day", "Large doses of Vit. C", "Thyroxine", "Bisphosphonates", "Oestrogens"], correct: ["D"], exp: "Bisphosphonates (antiresorptive agents) are first-line pharmacotherapy for osteoporosis to reduce fracture risk." },
            { id: 79, text: "Paget's disease (osteitis deformans):", options: ["Is generalized affection of the skeleton in middle aged and elderly men but not women", "Is characterized by hardening of the bones", "Is caused by deficiency of testosterone", "May cause pathological fractures", "Becomes sarcomatous in about 25% of patients"], correct: ["D"], exp: "Disorganized hyperactive bone remodeling in Paget's leads to weak, enlarged bones prone to pathologic fractures." },
            { id: 80, text: "Paget's disease:", options: ["Is asymptomatic in most patients", "Leads to kyphosis and stooping", "Leads to genu valgum", "May result in cardiac failure because of frequently associated valvular affections", "May shorten the height"], correct: ["A", "B", "E"], exp: "Most Paget's cases are asymptomatic. Bone softening leads to spinal compression (kyphosis), height loss, and bow legs." },
            { id: 81, text: "In Paget's disease:", options: ["The serum alkaline phosphatase is markedly raised", "The serum phosphate is usually low", "The serum calcium is usually normal", "The affected bones on x-ray are dense, often deformed, narrow and contains cyst-like areas", "Calcitonin 50-100 i.u. intravenously daily for several months may arrest the disease"], correct: ["A", "C", "E"], exp: "Marked elevation of serum Alkaline Phosphatase reflects intense osteoblastic activity; serum calcium remains normal." },
            { id: 82, text: "Clinical features in scurvy include:", options: ["Subperiosteal haematoma", "Fever", "Bleeding gums", "Sabre tibia", "Separation of the epiphyses"], correct: ["A", "C"], exp: "Vitamin C deficiency impairs collagen synthesis, causing capillary fragility: Subperiosteal hematomas and bleeding gums." },
            { id: 83, text: "Rickets:", options: ["Is seen in children and adolescents", "Is in all patients caused by inadequate Vit. D intake", "Results in failure of calcification of osteoid to osseous bone", "Pathologically gives rise to a wide, thick cartilage zone of the epiphyseal growth plate", "Is now rare in the world because of routine administration of Vit. D to children"], correct: ["C", "D"], exp: "Rickets is impaired mineralization of osteoid and growth plate cartilage in children, leading to unmineralized osteoid buildup and widened physes." },
            { id: 84, text: "Clinical features in rickets include:", options: ["Diarrhoea and vomiting", "Tetany", "Knock knees but not bow legs", "Thickening and widening of the wrists", "Bossing of the frontal, parietal, costal and phalangeal bones"], correct: ["B", "D"], exp: "Rachitic signs: Hypocalcemic tetany, physeal expansion (widened wrists), rachitic rosary, frontal bossing, and bow legs." },
            { id: 85, text: "In rickets:", options: ["The serum alkaline phosphatase is normal", "The serum phosphorous is usually low", "The blood urea may be elevated", "The urine phosphate may be elevated", "The faecal fat may be more than 6g daily"], correct: ["B", "C", "D", "E"], exp: "Secondary hyperparathyroidism in rickets increases renal phosphate excretion (phosphaturia), depressing serum phosphorus." },
            { id: 86, text: "In the treatment of rickets:", options: ["Vit.D 1,000 i.u. given daily gives dramatic results", "The serum calcium, phosphate and alkaline phosphatase are checked monthly", "Hypocalcaemia or hypercalcaemia may occur", "Oral calcium 1g should be given daily", "Bony deformities may recover spontaneously"], correct: ["E"], exp: "With Vitamin D repletion and remineralization, minor rachitic angular bone deformities can remodel spontaneously in young growing children." },
            { id: 87, text: "Osteomalacia:", options: ["Is uncommon and is generally seen in elderly women and rarely in pregnant or lactating women", "May deform the pelvis", "May complicate Billroth I partial gastrectomy", "Is confirmed by biopsy of the iliac crest", "Is treated with Vit. D 2,000 i.u. and calcium 1g daily"], correct: ["A", "B", "D"], exp: "Osteomalacia ('adult rickets') impairs osteoid mineralization, causing pelvic deformities. Non-decalcified iliac crest bone biopsy is diagnostic." },
            { id: 88, text: "A 1-year old male child with swollen immobile limbs, restlessness, and bleeding gums. Diagnosis:", options: ["Sickle cell disease", "Acute poliomyelitis", "Scurvy", "Acute osteomyelitis", "Anaemia"], correct: ["C"], exp: "Infantile scurvy presents with pseudoparalysis from painful subperiosteal hematomas, irritability, and bleeding gums." },
            { id: 89, text: "Investigations that will be useful in establishing the diagnosis include:", options: ["Full blood count and sickling", "X-ray of the affected limbs", "Serum ascorbic acid", "Urinary excretion of ascorbic acid after a loading dose", "Blood culture"], correct: ["B", "D"], exp: "Radiographs show subperiosteal elevation/calcification. Ascorbic acid loading excretion tests confirm Vitamin C deficiency." },
            { id: 90, text: "Lumbar spinal epidural abscess:", options: ["Is fairly common", "Is a metastatic infection caused by staph. aureus", "Causes localized pain often with radicular radiation", "Causes rapidly developing spastic paraplegia and sphincteric incompetence", "Is evacuated through laminectomy under antibiotic cover"], correct: ["B", "C"], exp: "Metastatic S. aureus epidural abscess causes severe midline back pain, radicular shooting pain, and rapid cord compression." },
            { id: 91, text: "The correct posture when sitting is:", options: ["Feet flat on the ground", "Chest lifted", "Head low", "Shoulder relaxed", "Arm fully pronated"], correct: ["A", "B"], exp: "Ergonomic sitting posture requires feet resting flat on the floor, lumbar support, chest lifted, and shoulders relaxed." },
            { id: 92, text: "Bone changes in sickle cell disease include:", options: ["Enlarged costo-chondral junction", "Expansion of the diploe", "Platyspondyly", "Coxa vara", "Dactylitis"], correct: ["B", "C", "E"], exp: "SCD marrow expansion widens skull diploë ('hair-on-end'). Microvascular infarction causes dactylitis and vertebral body flattening (platyspondyly)." },
            { id: 93, text: "Osteomyelitis in sickle cell disease is characterized by:", options: ["Asymmetrical involvement of the bones", "Diaphyseal involvement", "Refraction to medical treatment in the early stages", "Multifocal distribution", "Severe septicaemia"], correct: ["B"], exp: "In contrast to classic pediatric metaphyseal osteomyelitis, sicklers frequently develop osteomyelitis in the diaphyseal shaft secondary to marrow infarction." },
            { id: 94, text: "In prolapse of lumbar intervertebral disc:", options: ["The annulus fibrosus is degenerated", "The anterior longitudinal ligament is frayed", "The nucleus pulposus herniates into the neural canal following an extension injury", "Sneezing may be a precipitation trauma", "The commonest site is L3-4"], correct: ["A", "D"], exp: "Disc herniation involves nucleus pulposus extruding through tears in degenerated annulus fibrosus. Intrathecal pressure spikes (coughing/sneezing) trigger symptoms." },
            { id: 95, text: "A 40-year old man with lumbar pain radiating down right buttock, posterior thigh, calf to foot. Disc level:", options: ["L1-2", "L2-3", "L3-4", "L4-5", "L5-S1"], correct: ["E"], exp: "S1 root radiculopathy (typically caused by L5-S1 disc herniation) characteristically radiates down posterior thigh, calf, and plantar foot." },
            { id: 96, text: "In prolapsed lumbar intervertebral disc:", options: ["Paraesthesia, hyper and hyposensitivity in a dermatome area may occur", "Impairment of tendon reflex is unusual", "Sphincteric disturbance is common", "Muscle atrophy may occur", "Lasegue's sign is negative"], correct: ["A"], exp: "Nerve root compression produces dermatomal sensory alterations (paresthesias, hyperesthesia, hypoesthesia)." },
            { id: 97, text: "In spondylosis:", options: ["The nucleus pulposus shrinks as a result of progressive decrease in its water content", "There is degeneration of the cartilaginous plates over the vertebral bodies", "The annulus fibrosis remains intact", "Pain is centered in the spine and associated with stiffness and limitation of spinal movements", "X-ray shows narrowing of the intervertebral joints and new bone formation at the periphery"], correct: ["A", "B", "D", "E"], exp: "Spinal spondylosis involves disc dehydration, endplate sclerosis, loss of disc height, marginal osteophytosis, and axial spinal stiffness." },
            { id: 98, text: "Ankylosing spondylitis:", options: ["Is uncommon in West Africans and in Caucasians is more common in young adult females", "Is characterized by calcification and subsequent ossifications of the ligaments and capsule of the joints", "Starts in the thoracic intervertebral joints and spreads downwards to the lumbosacral and sacro-iliac joints", "Gives rise to pain and stiffness worse in the morning and after a period of rest", "Leads to extension deformity of the spine and the ESR is markedly raised"], correct: ["B", "D"], exp: "Ankylosing spondylitis features capsular/ligamentous ossification ('bamboo spine') and inflammatory back pain worse in morning/rest." },
            { id: 99, text: "Severe low back pain in a 40-year old woman, which is not relieved by rest in bed, may be due to:", options: ["Faulty posture on standing and sitting", "Complete rupture of an interspinous ligament", "Cervicitis", "Anxiety neurosis", "Vertebral metastatic carcinoma from the breast"], correct: ["C", "D", "E"], exp: "Non-mechanical back pain unaffected by rest or position strongly signals sinister etiology (malignant vertebral metastasis) or pelvic referred visceral pathology." },
            { id: 100, text: "Investigations that must be done in every patient with low back pain are:", options: ["Plain x-ray of thoracic, lumbar and sacral spine", "Tomogram", "Myelogram", "ESR", "Serum alkaline phosphatase"], correct: ["A", "D", "E"], exp: "Baseline initial evaluation for severe/chronic back pain includes plain spinal radiographs, inflammatory markers (ESR), and serum alkaline phosphatase." },
            { id: 101, text: "Measures taken in the management of muscular or ligamentous strain of the spine include:", options: ["Rest in bed", "Short wave diathermy and massage", "Wearing of surgical corset", "Operative exploration", "Muscle strengthening exercises"], correct: ["B", "C", "E"], exp: "Conservative lumbar strain management: Physical therapy modalities (heat/diathermy), temporary corset support, and core muscle strengthening." },
            { id: 102, text: "Cancellous osteoma:", options: ["Is a true tumour", "Is found commonly at the end of long bones", "Continues to grow throughout life", "May undergo malignant change", "Is usually symptomless"], correct: ["B", "E"], exp: "Cancellous osteomas occur near long bone ends and are benign, usually asymptomatic lesions." },
            { id: 103, text: "Compact (ivory) osteoma:", options: ["Arises in any bone", "Is sessile and slow-growing", "Is painful", "Is covered by a cap of cartilage", "May cause epilepsy if it involves the inner table of the skull"], correct: ["B", "E"], exp: "Ivory osteomas are dense benign skull lesions. Intracranial extension from the inner skull table can exert focal mass effect, causing seizures." },
            { id: 104, text: "Osteochondroma:", options: ["Is mushroom in shape, pedunculated or sessile", "Has a growing cap of cartilage", "Is most probably malignant if it continues to grow after skeletal maturity", "Changes to osteo-chondrosarcoma in about 25% of patients", "Should be left alone if it is near the trunk, e.g. scapula or pelvis, as it is not likely to become malignant"], correct: ["A", "B", "C"], exp: "Osteochondromas are cartilage-capped bony exostoses. Growth after skeletal maturity suggests chondrosarcomatous transformation." },
            { id: 105, text: "Osteoclastoma (Giant Cell Tumor of Bone):", options: ["Arises at the junction of the epiphysis and the metaphysis and spreads to the epiphysis", "Normally penetrates into the joint", "Is a spindle-cell tumour with giant cells formed by coalescence of some of the spindle cells", "Is benign in 50% and frankly malignant in 15% of cases, and the rest though benign recur after removal", "Affects the 10-20 age group"], correct: ["A", "C", "D"], exp: "Giant cell tumor arises in epiphyseal-metaphyseal regions of skeletally mature bones (aged 20-40). High local recurrence." },
            { id: 106, text: "The common sites of osteoclastoma include the:", options: ["Scapula", "Lower end of the femur", "Lower end of the tibia", "Pelvis", "Lower end of the radius"], correct: ["B"], exp: "The most common anatomical location for Giant Cell Tumor is around the knee (distal femur)." },
            { id: 107, text: "Treatment of osteoclastoma may be by:", options: ["Amputation", "Excision", "Curettage and bone graft", "Radiotherapy", "Cytotoxic therapy"], correct: ["A", "B", "C", "D"], exp: "Surgical options range from intralesional curettage with bone grafting to wide en-bloc resection or amputation for aggressive lesions." },
            { id: 108, text: "Enchondroma:", options: ["Is a true tumour arising usually in the metaphysis or shaft of the short long bones of the hand or feet", "Is usually seen in children", "May produce a pathological fracture", "Shows on x-ray as a sclerotic zone within the bone with cortical ballooning", "Is treated by excision"], correct: ["C"], exp: "Enchondromas are benign intramedullary cartilage tumors of short tubular hand/foot bones, often presenting via pathologic fracture." },
            { id: 109, text: "Benign chondroblastoma:", options: ["Is seen in adolescents under 20yrs", "Is more common in females", "Histologically consists of young cartilage cells with areas of giant cell transformation, myxoid and collagenous cells", "Starts in the epiphysis", "May rarely recur after excision or curettage and show malignant characteristics"], correct: ["A", "C", "D", "E"], exp: "Chondroblastoma is a rare benign epiphyseal cartilaginous tumor occurring in skeletally immature adolescents (<20 yrs)." },
            { id: 110, text: "Bone 'swellings' originating from osteoblast include:", options: ["Fibrous osteoma", "Ossifying fibroma", "Osteochondroma", "Aneurysmal bone cyst", "Osteoclastoma"], correct: ["A", "C", "E"], exp: "Osteoblast-lineage derivative skeletal proliferations include osteomas and osteoblastoma variants." },
            { id: 111, text: "A simple bone cyst (Unicameral Bone Cyst):", options: ["Is common in children but rare in adults", "May involve any bone", "Arises in the epiphysis", "Is usually symptomless", "Is treated by excision"], correct: ["A", "B", "D"], exp: "UBCs are fluid-filled metaphyseal lesions in growing children (proximal humerus/femur), usually asymptomatic until presenting with pathological fracture." },
            { id: 112, text: "A solitary radiolucent lesion in the metaphysis of the femur in a boy 15 may be:", options: ["Non-ossifying fibroma", "Chondroma", "Osteoclastoma", "Solitary bone cyst", "Benign chondroblastoma"], correct: ["A", "B", "D", "E"], exp: "Differential for pediatric metaphyseal lytic lesion: Non-ossifying fibroma, solitary bone cyst, enchondroma, or chondroblastoma extension." },
            { id: 113, text: "Osteosarcoma:", options: ["Is the commonest bone tumour", "Is usually metaphyseal in origin", "Contains elements of bone and cartilage but not of fibrous tissue", "Arises from primitive spindle cells", "Does not arise from extra-osseous tissue"], correct: ["B", "D"], exp: "Osteosarcoma is a primary malignant spindle cell neoplasm originating in long bone metaphyses, producing malignant osteoid matrix." },
            { id: 114, text: "Osteosarcoma may arise from:", options: ["Cancellous osteoma", "Enchondroma", "Osteochondroma", "Osteitis deformans", "Ossifying fibroma"], correct: ["C", "D"], exp: "Secondary osteosarcoma can arise in Paget's disease (osteitis deformans) or via malignant transformation of osteochondromas." },
            { id: 115, text: "Osteosarcoma spreads mainly to the:", options: ["Lymph nodes", "Liver", "Lungs", "Brain", "Other bones"], correct: ["C"], exp: "Osteosarcoma metastasizes predominantly hematogenously, with the lungs being the primary site of early metastasis." },
            { id: 116, text: "Osteosarcoma:", options: ["Has a peak incidence in the first decade", "Occurs around the knee in 50% of patients", "Has a male/female ratio of 1.5/1", "Does not present with pathological fracture", "Presents with a painful, tender, warm swelling"], correct: ["C", "E"], exp: "Osteosarcoma shows slight male predominance and presents with a rapidly expanding, painful, warm, vascular soft-tissue mass." },
            { id: 117, text: "Radiological features of osteosarcoma include:", options: ["Diaphyseal bone destruction", "Soft tissue mass or bone formation", "Radiate bone spicules of the cortex in the affected area", "Dense sclerosis of the rest of the bone", "Triangular condensation of bone at the site of periosteal elevation"], correct: ["B", "C", "E"], exp: "Radiographic features: Mixed lytic/blastic lesion, Codman's triangle (periosteal elevation), and 'sunburst' cortical spiculation." },
            { id: 118, text: "The most essential investigation after establishing a diagnosis of osteosarcoma is:", options: ["Skeletal survey", "X-ray of the lungs", "Blood profile", "E.S.R", "Serum alkaline phosphate"], correct: ["B"], exp: "Chest radiography / CT staging is essential post-diagnosis to evaluate for pulmonary metastases." },
            { id: 119, text: "The present acceptable forms of treatment of osteosarcoma include:", options: ["Amputation followed by cyclical combination cytotoxic therapy", "Radiotherapy followed by amputation", "Cytotoxic therapy followed by local resection", "Amputation", "Cyclical combination cytotoxic chemotherapy"], correct: ["A", "C"], exp: "Standard care: Neoadjuvant multi-agent chemotherapy -> Wide surgical resection (limb-salvage or amputation) -> Adjuvant chemotherapy." },
            { id: 120, text: "Cytotoxic drugs currently used in the treatment of osteosarcoma include:", options: ["Methotrexate", "Actinomycin D", "Vincristine", "Cyclophosphamide", "Doxorubicin"], correct: ["A", "C", "D", "E"], exp: "Effective chemotherapy regimens for osteosarcoma utilize high-dose Methotrexate, Doxorubicin, Cisplatin, and Cyclophosphamide/Ifosfamide." },
            { id: 121, text: "An x-ray shows a disappearing bone. The conditions to consider include:", options: ["Osteoclastoma", "Aneurysmal bone cyst", "Angiosarcoma", "Neurofibromatosis", "Histoplasmosis duboisii"], correct: ["B", "C", "D", "E"], exp: "Conditions causing rapid osteolysis ('phantom bone'): Aneurysmal bone cyst, angiosarcoma / Gorham's disease, neurofibromatosis, and fungal osteomyelitis." },
            { id: 122, text: "A 50-year old man with recurrent rib pain; X-rays show multiple punched-out lytic skull/pelvic lesions. You consider:", options: ["Metastases from carcinoma of the prostate", "Metastases from the thyroid", "Multiple myeloma", "Bronchogenic carcinoma", "Ewing's tumour"], correct: ["B", "C"], exp: "Punched-out non-expanded lytic bone lesions in an adult >50 are classic for Multiple Myeloma or osteolytic metastases (thyroid/renal)." },
            { id: 123, text: "The investigation that will be helpful include:", options: ["Full blood count", "Biopsy", "Serum acid phosphatase", "Bence-Jones proteinuria", "Thyroid scan"], correct: ["A", "B", "D"], exp: "Workup for multiple myeloma: Serum/urine protein electrophoresis for Bence-Jones light chains, bone marrow biopsy, and FBC." },

        // GLOBAL APPLICATION STATE
        const state = {
            currentChapter: 53, // 53 or 54
            typeFilter: 'all',  // 'all', 'sba', 'ma'
            statusFilter: 'all',// 'all', 'unanswered', 'correct', 'incorrect'
            searchQuery: '',
            currentIndex: 0,
            userAnswers: {
                53: {}, // { qId: { selected: ['A'], checked: true, isCorrect: true } }
                54: {}
            },
            darkMode: false
        };

        const elements = {
            chap53Btn: document.getElementById('chap53Btn'),
            chap54Btn: document.getElementById('chap54Btn'),
            badgeAllCount: document.getElementById('badgeAllCount'),
            badgeSbaCount: document.getElementById('badgeSbaCount'),
            badgeMaCount: document.getElementById('badgeMaCount'),
            statAnswered: document.getElementById('statAnswered'),
            statCorrect: document.getElementById('statCorrect'),
            statIncorrect: document.getElementById('statIncorrect'),
            scorePercentBadge: document.getElementById('scorePercentBadge'),
            scoreProgressBar: document.getElementById('scoreProgressBar'),
            searchInput: document.getElementById('searchInput'),
            gridCountDisplay: document.getElementById('gridCountDisplay'),
            questionGrid: document.getElementById('questionGrid'),

            themeIcon: document.getElementById('themeIcon'),
            resetAppBtn: document.getElementById('resetAppBtn')
        };

        // LOCAL STORAGE
        function loadSavedState() {
            const saved = localStorage.getItem('ortho_app_v2_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.userAnswers = parsed.userAnswers || state.userAnswers;
                    state.currentChapter = parsed.currentChapter || 53;
                    state.typeFilter = parsed.typeFilter || 'all';
                    state.darkMode = parsed.darkMode || false;
                } catch(e) {
                    console.error("Failed loading saved state", e);
                }
            }
            document.documentElement.classList.toggle('dark', state.darkMode);
        }

        function saveAppState() {
            localStorage.setItem('ortho_app_v2_state', JSON.stringify({
                userAnswers: state.userAnswers,
                currentChapter: state.currentChapter,
                typeFilter: state.typeFilter,
                darkMode: state.darkMode
            }));
        }

        function getCurrentChapterDataset() {
            return state.currentChapter === 53 ? RAW_DATA_CH53 : RAW_DATA_CH54;
        }

        // FILTER LOGIC
        function getFilteredQuestions() {
            const dataset = getCurrentChapterDataset();
            const answers = state.userAnswers[state.currentChapter] || {};

            return dataset.filter((q, idx) => {
                const isSba = q.correct.length === 1;
                
                // Format Filter (SBA vs MA)
                if (state.typeFilter === 'sba' && !isSba) return false;
                if (state.typeFilter === 'ma' && isSba) return false;

                // Status Filter
                const qAns = answers[q.id];
                if (state.statusFilter === 'unanswered' && qAns && qAns.checked) return false;
                if (state.statusFilter === 'correct' && (!qAns || !qAns.checked || !qAns.isCorrect)) return false;
                if (state.statusFilter === 'incorrect' && (!qAns || !qAns.checked || qAns.isCorrect)) return false;

                // Search Query
                if (state.searchQuery) {
                    const query = state.searchQuery.toLowerCase();
                    const qNum = (idx + 1).toString();
                    const textMatch = q.text.toLowerCase().includes(query);
                    const numMatch = qNum === query || (`q${qNum}` === query);
                    const optMatch = q.options.some(o => o.toLowerCase().includes(query));
                    return textMatch || numMatch || optMatch;
                }

                return true;
            });
        }

        // INITIALIZATION
        function initApp() {
            loadSavedState();
            bindEventListeners();
            switchChapter(state.currentChapter, false);
            lucide.createIcons();
        }

        function bindEventListeners() {
            elements.themeToggleBtn.addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                document.documentElement.classList.toggle('dark', state.darkMode);
                saveAppState();
            });

            elements.resetAppBtn.addEventListener('click', () => {
                if (confirm('Reset all progress for Chapter 53 and Chapter 54?')) {
                    state.userAnswers = { 53: {}, 54: {} };
                    saveAppState();
                    renderAll();
                }
            });

            elements.chap53Btn.addEventListener('click', () => switchChapter(53));
            elements.chap54Btn.addEventListener('click', () => switchChapter(54));

            // Type Filter buttons (All, SBA, MA)
            document.querySelectorAll('.type-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.currentTarget;
                    state.typeFilter = targetBtn.dataset.typeFilter;
                    state.currentIndex = 0;
                    updateTypeFilterStyles();
                    renderAll();
                });
            });

            // Status Filter pills
            document.querySelectorAll('.status-pill').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.status-pill').forEach(b => {
                        b.classList.remove('bg-brand-600', 'text-white');
                        b.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                    });
                    e.target.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-slate-300');
                    e.target.classList.add('bg-brand-600', 'text-white');

                    state.statusFilter = e.target.dataset.statusFilter;
                    state.currentIndex = 0;
                    renderMatrix();
                    renderQuestion();
                });
            });

            // Search
            elements.searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.trim();
                state.currentIndex = 0;
                renderMatrix();
                renderQuestion();
            });
        }

        function updateTypeFilterStyles() {
            document.querySelectorAll('.type-filter-btn').forEach(btn => {
                if (btn.dataset.typeFilter === state.typeFilter) {
                    btn.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-200');
                    btn.classList.add('bg-brand-600', 'text-white');
                } else {
                    btn.classList.remove('bg-brand-600', 'text-white');
                    btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-200');
                }
            });
        }

        function switchChapter(chapNum, resetIndex = true) {
            state.currentChapter = chapNum;
            if (resetIndex) state.currentIndex = 0;

            if (chapNum === 53) {
                elements.chap53Btn.className = "chap-tab-btn py-2 px-2.5 text-xs font-bold rounded-lg shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400";
                elements.chap54Btn.className = "chap-tab-btn py-2 px-2.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            } else {
                elements.chap54Btn.className = "chap-tab-btn py-2 px-2.5 text-xs font-bold rounded-lg shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400";
                elements.chap53Btn.className = "chap-tab-btn py-2 px-2.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            }

            updateTypeFilterStyles();
            saveAppState();
            renderAll();
        }

        function renderAll() {
            updateCountsAndStats();
            renderMatrix();
            renderQuestion();
        }

        function updateCountsAndStats() {
            const dataset = getCurrentChapterDataset();
            const answers = state.userAnswers[state.currentChapter] || {};
            
            let sbaCount = 0;
            let maCount = 0;
            let answeredCount = 0;
            let correctCount = 0;

            dataset.forEach(q => {
                if (q.correct.length === 1) sbaCount++;
                else maCount++;

                const ans = answers[q.id];
                if (ans && ans.checked) {
                    answeredCount++;
                    if (ans.isCorrect) correctCount++;
                }
            });

            elements.badgeAllCount.textContent = dataset.length;
            elements.badgeSbaCount.textContent = sbaCount;
            elements.badgeMaCount.textContent = maCount;

            const totalFiltered = getFilteredQuestions().length;
            const incorrectCount = answeredCount - correctCount;
            const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            elements.statAnswered.textContent = `${answeredCount}/${dataset.length}`;
            elements.statCorrect.textContent = correctCount;
            elements.statIncorrect.textContent = incorrectCount;
            elements.scorePercentBadge.textContent = `${percentage}%`;
            elements.scoreProgressBar.style.width = `${percentage}%`;
        }

        function renderMatrix() {
            const dataset = getCurrentChapterDataset();
            const filtered = getFilteredQuestions();
            const answers = state.userAnswers[state.currentChapter] || {};

            elements.gridCountDisplay.textContent = `${filtered.length} of ${dataset.length}`;
            elements.questionGrid.innerHTML = '';

            if (filtered.length === 0) {
                elements.questionGrid.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-slate-400">No matching questions</div>`;
                return;
            }

            filtered.forEach((q, filteredIdx) => {
                const originalIndex = dataset.findIndex(item => item.id === q.id);
                const ans = answers[q.id];
                const btn = document.createElement('button');
                btn.textContent = originalIndex + 1;

                let classNames = "h-9 text-xs font-semibold rounded-lg border transition flex items-center justify-center relative ";
                
                if (filteredIdx === state.currentIndex) {
                    classNames += "ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800 ";
                }

                if (ans && ans.checked) {
                    if (ans.isCorrect) {
                        classNames += "bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600";
                    } else {
                        classNames += "bg-rose-500 text-white border-rose-600 hover:bg-rose-600";
                    }
                } else {
                    classNames += "bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600";
                }

                btn.className = classNames;
                btn.title = `Q${originalIndex + 1}: ${q.correct.length === 1 ? 'Single Best Answer' : 'Multiple Selection'}`;
                btn.addEventListener('click', () => {
                    state.currentIndex = filteredIdx;
                    renderMatrix();
                    renderQuestion();
                });

                elements.questionGrid.appendChild(btn);
            });
        }

        function renderQuestion() {
            const filtered = getFilteredQuestions();
            if (filtered.length === 0) {
                elements.mcqContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <i data-lucide="filter-x" class="w-12 h-12 text-slate-300 dark:text-slate-600 mb-3"></i>
                        <h3 class="text-base font-bold text-slate-700 dark:text-slate-300">No Questions Match Filter</h3>
                        <p class="text-xs text-slate-400 max-w-xs mt-1">Try clearing your search query or selecting a different question format.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (state.currentIndex >= filtered.length) state.currentIndex = 0;
            const q = filtered[state.currentIndex];
            const dataset = getCurrentChapterDataset();
            const originalIndex = dataset.findIndex(item => item.id === q.id);
            const qAns = (state.userAnswers[state.currentChapter] || {})[q.id] || { selected: [], checked: false };
            const isSba = q.correct.length === 1;

            const letterMap = ['A', 'B', 'C', 'D', 'E'];

            let html = `
                <div>
                    <!-- Top Meta Header -->
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-700">

                            <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-100 text-brand-700 dark:bg-brand-950 dark:text-brand-300">
                                Chapter ${state.currentChapter}
                            </span>
                            <span class="text-xs font-semibold text-slate-400">
                                Question ${originalIndex + 1} of ${dataset.length}
                            </span>
                        </div>
                        
                        <!-- Format Indicator Badge -->
                        <span class="px-2.5 py-1 text-xs font-bold rounded-lg flex items-center gap-1.5 ${isSba ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}">
                            ${isSba ? `<i data-lucide="circle-dot" class="w-3.5 h-3.5"></i> Single Best Answer (SBA)` : `<i data-lucide="check-square" class="w-3.5 h-3.5"></i> Multiple Selection (${q.correct.length} Correct Options)`}

                        ${q.text}
                    </h2>

                    <!-- Options -->
                    <div class="space-y-3 mb-6">
            `;

            q.options.forEach((optText, oIdx) => {
                const letter = letterMap[oIdx];
                const isSelected = qAns.selected.includes(letter);
                const isCorrectOption = q.correct.includes(letter);

                let optionClass = "w-full text-left p-3.5 sm:p-4 rounded-xl border text-sm flex items-start gap-3 transition cursor-pointer ";
                let inputType = isSba ? "radio" : "checkbox";
                
                if (qAns.checked) {
                    if (isCorrectOption) {
                        optionClass += "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-950 dark:text-emerald-200 font-medium";
                    } else if (isSelected && !isCorrectOption) {
                        optionClass += "bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-950 dark:text-rose-200";
                    } else {
                        optionClass += "bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700 opacity-60";

                    } else {
                        optionClass += "bg-slate-50/60 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50";
                    }
                }

                html += `
                    <div class="${optionClass}" onclick="toggleOption('${letter}', ${!isSba}, ${qAns.checked})">
                        <div class="mt-0.5">
                            <input type="${inputType}" name="mcqOption" ${isSelected ? 'checked' : ''} ${qAns.checked ? 'disabled' : ''} class="w-4 h-4 text-brand-600 border-slate-300 focus:ring-brand-500">
                        </div>
                        <div class="flex-1">
                            <span class="font-bold mr-1">${letter}.</span> ${optText}
                        </div>
                        ${qAns.checked && isCorrectOption ? `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600 dark:text-emerald-400 shrink-0"></i>` : ''}
                        ${qAns.checked && isSelected && !isCorrectOption ? `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600 dark:text-rose-400 shrink-0"></i>` : ''}
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- Controls -->
                    <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                        <div>
                            ${!qAns.checked ? `
                                <button onclick="checkAnswer(${q.id})" ${qAns.selected.length === 0 ? 'disabled class="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-400 rounded-xl font-bold text-xs cursor-not-allowed"' : 'class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-1.5"'}>
                                    <i data-lucide="check-square" class="w-4 h-4"></i> Submit Answer
                                </button>
                            ` : `
                                <button onclick="clearSingleAnswer(${q.id})" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white border border-slate-300 dark:border-slate-600 rounded-xl transition flex items-center gap-1">
                                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Re-try Question
                                </button>
                            `}
                        </div>

                        <!-- Prev / Next Pagination -->
                        <div class="flex items-center gap-2">
                            <button onclick="navigatePrev()" ${state.currentIndex === 0 ? 'disabled' : ''} class="px-3.5 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 transition flex items-center gap-1">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i> Prev
                            </button>
                            <button onclick="navigateNext()" ${state.currentIndex === filtered.length - 1 ? 'disabled' : ''} class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-white disabled:opacity-40 transition flex items-center gap-1">
                                Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            <!-- Clinical Explanation Box -->
            if (qAns.checked) {
                html += `
                    <div class="mt-6 p-5 rounded-2xl bg-amber-50/70 dark:bg-slate-900/80 border border-amber-200/60 dark:border-slate-700/60 animate-fadeIn">
                        <div class="flex items-center gap-2 mb-2 text-amber-800 dark:text-amber-400 font-bold text-sm">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                            <span>Clinical Rationale & Key Principles</span>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                            ${q.exp}
                        </p>
                        <div class="mt-3 text-xs font-semibold text-slate-500">
                            Correct Option(s): <span class="text-emerald-600 dark:text-emerald-400 font-bold">${q.correct.join(', ')}</span>
                        </div>
                    </div>
                `;
            }

            elements.mcqContainer.innerHTML = html;
            lucide.createIcons();
        }

        // GLOBAL INTERACTION HANDLERS
        window.toggleOption = function(letter, isMulti, isChecked) {
            if (isChecked) return; // Locked once checked

            const filtered = getFilteredQuestions();
            const q = filtered[state.currentIndex];
            
            if (!state.userAnswers[state.currentChapter]) {
                state.userAnswers[state.currentChapter] = {};
            }

            let qAns = state.userAnswers[state.currentChapter][q.id] || { selected: [], checked: false };

            if (isMulti) {
                if (qAns.selected.includes(letter)) {
                    qAns.selected = qAns.selected.filter(l => l !== letter);
                } else {
                    qAns.selected.push(letter);
                }
            } else {
                qAns.selected = [letter];
            }

            state.userAnswers[state.currentChapter][q.id] = qAns;
            saveAppState();
            renderQuestion();
        };

        window.checkAnswer = function(qId) {
            const dataset = getCurrentChapterDataset();
            const q = dataset.find(item => item.id === qId);
            const qAns = state.userAnswers[state.currentChapter][qId];

            if (!qAns || qAns.selected.length === 0) return;

            const selectedSorted = [...qAns.selected].sort();
            const correctSorted = [...q.correct].sort();

            const isCorrect = selectedSorted.length === correctSorted.length && 
                              selectedSorted.every((val, index) => val === correctSorted[index]);

            qAns.checked = true;
            qAns.isCorrect = isCorrect;

            state.userAnswers[state.currentChapter][qId] = qAns;
            saveAppState();
            renderAll();
        };

        window.clearSingleAnswer = function(qId) {
            if (state.userAnswers[state.currentChapter][qId]) {
                delete state.userAnswers[state.currentChapter][qId];
                saveAppState();
                renderAll();
            }
        };

        window.navigateNext = function() {
            const filtered = getFilteredQuestions();
            if (state.currentIndex < filtered.length - 1) {
                state.currentIndex++;
                renderMatrix();
                renderQuestion();
            }
        };

        window.navigatePrev = function() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderMatrix();
                renderQuestion();
            }
        };

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight') {
                navigateNext();
            } else if (e.key === 'ArrowLeft') {
                navigatePrev();
            }
        });

        // App Launch
        window.onload = initApp;
    </script>
</body>
</html>
